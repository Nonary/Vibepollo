---
name: Validate Windows runner
permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Nonzero package version for this validation build
        required: true
        type: string
      build_tests:
        description: Compile and execute the full Windows test suite without daily signing
        type: boolean
        default: false
      use_self_hosted:
        description: Use the local Windows release runner
        type: boolean
        default: false
      qualify_nightly_installer:
        description: Fresh unsigned nightly package with mandatory tests and exact gamepad signing
        type: boolean
        default: false
      release_tag:
        description: Existing nightly release page being corrected; does not create or move a tag
        type: string
        default: ''

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-qualification:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      nightly_qualification: ${{ steps.classify.outputs.nightly_qualification }}
      daily_validation_only: ${{ steps.classify.outputs.daily_validation_only }}
    steps:
      - name: Classify numeric versus legacy qualification
        id: classify
        env:
          QUALIFY_NIGHTLY: ${{ inputs.qualify_nightly_installer }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python - <<'PY'
          import os, re
          numeric = os.environ['QUALIFY_NIGHTLY'] == 'true' and bool(
              re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_VERSION']))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"nightly_qualification={str(numeric).lower()}\n")
              out.write(f"daily_validation_only={str(numeric).lower()}\n")
          PY

  nightly-anchor:
    needs: [classify-qualification]
    if: needs.classify-qualification.outputs.nightly_qualification == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable_anchor_tag: ${{ steps.anchor.outputs.stable_anchor_tag }}
      stable_anchor_commit: ${{ steps.anchor.outputs.stable_anchor_commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact published stable anchor
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/daily_release.py stable-anchor

  windows:
    needs: [classify-qualification, nightly-anchor]
    if: ${{ always() && needs.classify-qualification.result == 'success' && (needs.classify-qualification.outputs.nightly_qualification != 'true' || needs.nightly-anchor.result == 'success') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: ${{ inputs.use_self_hosted }}
      build_only: ${{ !inputs.qualify_nightly_installer }}
      build_tests: ${{ inputs.qualify_nightly_installer || inputs.build_tests }}
      daily_unsigned: ${{ inputs.qualify_nightly_installer }}
      daily_validation_only: ${{ needs.classify-qualification.outputs.daily_validation_only }}
      release_commit: ${{ github.sha }}
      release_version: ${{ inputs.release_version }}
      release_tag: ${{ inputs.release_tag || (needs.classify-qualification.outputs.daily_validation_only == 'true' && inputs.release_version || '') }}
      release_channel: ${{ inputs.qualify_nightly_installer && 'nightly' || 'legacy' }}
      stable_anchor_tag: ${{ needs.nightly-anchor.outputs.stable_anchor_tag }}
      stable_anchor_commit: ${{ needs.nightly-anchor.outputs.stable_anchor_commit }}
      require_truehdr_runtime: ${{ inputs.qualify_nightly_installer }}
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      release_artifact_retention_days: 14
    secrets:
      truehdr_runtime_token: ${{ inputs.qualify_nightly_installer && secrets.TRUEHDR_RUNTIME_TOKEN || '' }}
      daily_gamepad_pfx_base64: ${{ inputs.qualify_nightly_installer && secrets.NIGHTLY_GAMEPAD_PFX_BASE64 || '' }}
      daily_gamepad_pfx_password: ${{ inputs.qualify_nightly_installer && secrets.NIGHTLY_GAMEPAD_PFX_PASSWORD || '' }}
