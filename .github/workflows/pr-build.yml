---
name: Validate Windows pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install host test headers
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev libboost-dev
      - name: Check Steam Controller feedback forwarding, queue policy, slot retirement and VHF fallback
        run: |
          python3 tests/input/test_haptic_queue.py
          python3 tests/input/test_steam_settings_forward.py
          python3 tests/input/test_vhf_feedback_retirement.py
          python3 tests/input/test_vhf_fallback.py
      - name: Check SC2026 client-to-driver click fidelity and the firmware attribute relay
        run: |
          git submodule update --init --depth 1 third-party/moonlight-common-c third-party/libvirtualgamepad
          python3 tests/input/test_sc26_buttons.py
          python3 tests/input/test_steam_attributes_forward.py

  windows:
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: false
      build_only: true
      build_tests: true
      release_commit: ${{ github.sha }}
      # A valid, explicitly non-release version for the existing MSI build checks.
      release_version: '0.0.1'
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
