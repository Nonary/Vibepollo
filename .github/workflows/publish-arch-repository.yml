---
name: Publish signed Arch repository
permissions: {}

on:
  schedule:
    # Also covers stable releases published with GITHUB_TOKEN, which cannot trigger a release event.
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published stable release tag, for example 2.0.6
        required: true
        type: string

concurrency:
  group: arch-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish Arch package
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
    permissions:
      actions: write
      contents: write
    environment: arch-repository
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_FINGERPRINT: ${{ vars.ARCH_REPO_GPG_FINGERPRINT }}
    steps:
      - name: Install publication tools
        shell: bash
        run: pacman -Syu --needed --noconfirm archlinux-keyring git github-cli gnupg jq python

      - name: Checkout publication workflow
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Check out current Arch repository
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          publication_dir="${RUNNER_TEMP}/arch-repo"
          if git ls-remote --exit-code origin refs/heads/arch-repo >/dev/null; then
            git fetch --depth=1 origin refs/heads/arch-repo:refs/remotes/origin/arch-repo
            git worktree add --detach "${publication_dir}" refs/remotes/origin/arch-repo
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            git worktree add --detach "${publication_dir}" HEAD
            git -C "${publication_dir}" switch --orphan arch-repo
          fi

      - name: Download and verify published Arch package
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          asset_tool=.github/scripts/arch_release_assets.py
          repo_dir="${RUNNER_TEMP}/arch-repo/x86_64"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            release_version="$(jq -er '.tag_name' <<<"$release_json")"
          else
            release_version="$REQUESTED_TAG"
            [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_version}")"
          fi
          selection="$(python "$asset_tool" select "$release_version" <<<"$release_json")"
          IFS=$'\t' read -r asset_id package_name digest <<<"$selection"
          {
            echo "package_name=${package_name}"
            echo "release_version=${release_version}"
            echo "digest=${digest}"
          } >>"$GITHUB_OUTPUT"

          previous_version=""
          previous_package=""
          if [[ -e "$repo_dir/vibepollo.db" ]]; then
            gpgv --keyring "$repo_dir/nonary-vibepollo.gpg" \
              "$repo_dir/vibepollo.db.sig" "$repo_dir/vibepollo.db"
            previous="$(python "$asset_tool" record "$repo_dir/vibepollo.db")"
            IFS=$'\t' read -r previous_version previous_package previous_digest <<<"$previous"
            if [[ "$package_name" == "$previous_package" ]]; then
              if [[ "$digest" != "$previous_digest" ]]; then
                echo "::error::Published release asset changed bytes without a new package version."
                exit 1
              fi
              if grep -Fqx -- "$package_name"$'\t'"$digest" "$repo_dir/release-assets.tsv" 2>/dev/null; then
                echo "changed=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          mkdir -p incoming
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >"incoming/${package_name}"
          package_version="$(python "$asset_tool" verify "incoming/${package_name}" "$release_version" "$digest")"
          if [[ -n "$previous_version" ]]; then
            ordering="$(vercmp "$package_version" "$previous_version")"
            if [[ "$ordering" == -1 || ( "$ordering" == 0 && "$package_name" != "$previous_package" ) ]]; then
              echo "::error::Refusing to replace indexed package $previous_version with $package_version."
              exit 1
            fi
          fi
          if [[ "$previous_package" == "$package_name" ]]; then
            previous_package=""
          fi
          echo "previous_package=${previous_package}" >>"$GITHUB_OUTPUT"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Import and verify repository signing key
        if: steps.release.outputs.changed == 'true'
        id: signing-key
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.ARCH_REPO_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_PRIVATE_KEY}" || -z "${EXPECTED_FINGERPRINT}" ]]; then
            echo '::error::ARCH_REPO_GPG_PRIVATE_KEY and ARCH_REPO_GPG_FINGERPRINT must be configured in the arch-repository environment.'
            exit 1
          fi

          printf '%s' "${SIGNING_PRIVATE_KEY}" | gpg --batch --import
          mapfile -t fingerprints < <(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print toupper($10); primary = 0 }'
          )
          if (( ${#fingerprints[@]} != 1 )); then
            echo "::error::Expected exactly one secret signing key, found ${#fingerprints[@]}."
            exit 1
          fi

          fingerprint="${fingerprints[0]}"
          expected="${EXPECTED_FINGERPRINT//[[:space:]]/}"
          if [[ "${fingerprint}" != "${expected^^}" ]]; then
            echo "::error::Imported signing key fingerprint does not match ARCH_REPO_GPG_FINGERPRINT."
            exit 1
          fi
          echo "fingerprint=${fingerprint}" >>"${GITHUB_OUTPUT}"

      - name: Sign package and export public key
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_PASSPHRASE}" ]]; then
            echo '::error::ARCH_REPO_GPG_PASSPHRASE is not configured in the arch-repository environment.'
            exit 1
          fi
          printf '%s' "${SIGNING_PASSPHRASE}" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "${FINGERPRINT}" --detach-sign "incoming/${PACKAGE_NAME}"
          gpg --batch --export "${FINGERPRINT}" >incoming/nonary-vibepollo.gpg
          gpg --batch --armor --export "${FINGERPRINT}" >incoming/nonary-vibepollo.asc
          printf '%s\n' "${FINGERPRINT}" >incoming/nonary-vibepollo-fingerprint.txt
          gpg --batch --verify "incoming/${PACKAGE_NAME}.sig" "incoming/${PACKAGE_NAME}"

      - name: Update repository database
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PREVIOUS_PACKAGE: ${{ steps.release.outputs.previous_package }}
          ASSET_DIGEST: ${{ steps.release.outputs.digest }}
          SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          publication_dir="${RUNNER_TEMP}/arch-repo"
          mkdir -p "${publication_dir}/x86_64"
          cp "incoming/${PACKAGE_NAME}.sig" incoming/nonary-vibepollo.gpg \
            incoming/nonary-vibepollo.asc incoming/nonary-vibepollo-fingerprint.txt \
            "${publication_dir}/x86_64/"

          cd "${publication_dir}/x86_64"
          # This repository publishes exactly the verified release package.
          # Rebuild both indexes so stale entries cannot survive publication.
          rm -f vibepollo.db vibepollo.db.sig vibepollo.db.tar.gz \
            vibepollo.db.tar.gz.sig vibepollo.db.tar.gz.old vibepollo.db.tar.gz.old.sig \
            vibepollo.files vibepollo.files.sig vibepollo.files.tar.gz \
            vibepollo.files.tar.gz.sig vibepollo.files.tar.gz.old vibepollo.files.tar.gz.old.sig
          repo-add vibepollo.db.tar.gz "${GITHUB_WORKSPACE}/incoming/${PACKAGE_NAME}"
          printf '%s' "${SIGNING_PASSPHRASE}" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "${FINGERPRINT}" --detach-sign vibepollo.db.tar.gz
          printf '%s' "${SIGNING_PASSPHRASE}" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "${FINGERPRINT}" --detach-sign vibepollo.files.tar.gz

          rm -f vibepollo.db vibepollo.db.sig vibepollo.files vibepollo.files.sig
          cp vibepollo.db.tar.gz vibepollo.db
          cp vibepollo.db.tar.gz.sig vibepollo.db.sig
          cp vibepollo.files.tar.gz vibepollo.files
          cp vibepollo.files.tar.gz.sig vibepollo.files.sig

          for index in vibepollo.db vibepollo.files; do
            gpgv --keyring "$PWD/nonary-vibepollo.gpg" "$index.sig" "$index"
            record="$(python "${GITHUB_WORKSPACE}/.github/scripts/arch_release_assets.py" record "$index")"
            IFS=$'\t' read -r version filename digest <<<"$record"
            [[ "$filename" == "$PACKAGE_NAME" && "$digest" == "$ASSET_DIGEST" ]]
          done

          # Keep the previous stable payload available for clients holding a cached index.
          if [[ ! "$PREVIOUS_PACKAGE" =~ ^vibepollo-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+(\.[0-9]+)?-x86_64\.pkg\.tar\.zst$ ]]; then
            PREVIOUS_PACKAGE=""
          fi
          printf '%s\t%s\n' "$PACKAGE_NAME" "$ASSET_DIGEST" >release-assets.new
          if [[ -f release-assets.tsv && -n "$PREVIOUS_PACKAGE" && "$PREVIOUS_PACKAGE" != "$PACKAGE_NAME" ]]; then
            awk -F '\t' -v package="$PREVIOUS_PACKAGE" '$1 == package' release-assets.tsv >>release-assets.new
          fi
          mv release-assets.new release-assets.tsv

          shopt -s nullglob
          for path in vibepollo-*.pkg.tar.zst vibepollo-*.pkg.tar.zst.sig; do
            case "$path" in
              "${PACKAGE_NAME}.sig"|"${PREVIOUS_PACKAGE}"|"${PREVIOUS_PACKAGE}.sig") ;;
              *) rm -f -- "$path" ;;
            esac
          done

      - name: Commit published repository
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          # The checkout is owned by a different uid than the container user.
          git config --global --add safe.directory '*'
          publication_dir="${RUNNER_TEMP}/arch-repo"
          git -C "${publication_dir}" config user.name 'Nonary release automation'
          git -C "${publication_dir}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "${publication_dir}" add --all
          if git -C "${publication_dir}" diff --cached --quiet; then
            echo 'Repository already contains this exact signed release.'
            exit 0
          fi
          git -C "${publication_dir}" commit -m "Publish Vibepollo ${RELEASE_VERSION} for Arch Linux"
          git -C "${publication_dir}" push origin HEAD:arch-repo

      - name: Deploy updated repository through Pages
        shell: bash
        env:
          CHANGED: ${{ steps.release.outputs.changed }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        run: |
          set -euo pipefail
          repo_dir="${RUNNER_TEMP}/arch-repo/x86_64"
          server=https://nonary.github.io/Vibepollo/arch/x86_64
          if [[ "$CHANGED" == false ]] &&
             curl -fsS --max-time 20 "$server/vibepollo.db" | cmp -s - "$repo_dir/vibepollo.db" &&
             curl -fsS --max-time 20 "$server/vibepollo.db.sig" | cmp -s - "$repo_dir/vibepollo.db.sig" &&
             curl -fsSIL --max-time 20 "$server/$PACKAGE_NAME" >/dev/null; then
            echo 'The signed package is already live.'
            exit 0
          fi
          gh workflow run update-pages.yml --ref master
