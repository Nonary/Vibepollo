---
name: CI-Windows
permissions: {}

on:
  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ''
      artifact_source_run_id:
        required: false
        type: string
        default: ''
      build_only:
        required: false
        type: boolean
        default: false
      build_tests:
        required: false
        type: boolean
        default: true
      release_artifact_retention_days:
        required: false
        type: number
        default: 1
      symbol_product_name:
        required: true
        type: string
      symbol_release_prefix:
        required: true
        type: string
      publish_symbols:
        required: false
        type: boolean
        default: false
      symbol_release_repo:
        required: false
        type: string
        default: Nonary/vibeshine_symbols
      symbol_release_tag:
        required: false
        type: string
        default: ''
      symbol_release_draft:
        required: false
        type: boolean
        default: false
      upload_symbols_artifact:
        required: false
        type: boolean
        default: false
      require_signpath_signing:
        required: false
        type: boolean
        default: false
      require_truehdr_runtime:
        required: false
        type: boolean
        default: false
      truehdr_runtime_release_repo:
        required: false
        type: string
        default: Nonary/vibeshine_truehdr_runtime
      truehdr_runtime_release_tag:
        required: false
        type: string
        default: v1.0.0
      truehdr_runtime_asset_name:
        required: false
        type: string
        default: ''
      signpath_organization_id:
        required: false
        type: string
        default: 1ba0e884-7ab4-43e6-aa84-9b2c7e3fba15
      signpath_project_slug:
        required: false
        type: string
        default: Vibepollo
      signpath_signing_policy_slug:
        required: false
        type: string
        default: release-signing
      signpath_wait_for_completion_timeout_in_seconds:
        required: false
        type: number
        # Submission and completion are bounded to ten minutes. The local helper
        # checks SignPath status every five seconds instead of exponential backoff.
        default: 600
      signpath_artifact_configuration_slug:
        required: false
        type: string
        # Setup-EXE (outer VibepolloSetup.exe) artifact configuration slug.
        # See docs/signpath/setup-exe.artifact-config.xml.
        default: setup-exe
      signpath_msi_artifact_configuration_slug:
        required: false
        type: string
        # Deep-signs first-party PEs inside the MSI, then the MSI container.
        # See docs/signpath/ for the executable consumer-MSI signing policy.
        default: msi-file-apollo
    secrets:
      symbol_token:
        required: false
      signpath_api_token:
        required: false
      truehdr_runtime_token:
        required: false

jobs:
  resolve_source_artifacts:
    name: Resolve release build artifacts
    if: inputs.artifact_source_run_id != ''
    runs-on: ubuntu-latest
    outputs:
      msi_name: ${{ steps.resolve.outputs.msi_name }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      symbol_pack_name: ${{ steps.resolve.outputs.symbol_pack_name }}
      symbols_artifact_id: ${{ steps.resolve.outputs.symbols_artifact_id }}
      unsigned_msi_artifact_id: ${{ steps.resolve.outputs.unsigned_msi_artifact_id }}
      unsigned_msi_signpath_artifact_id: ${{ steps.resolve.outputs.unsigned_msi_signpath_artifact_id }}
      versioninfo_artifact_id: ${{ steps.resolve.outputs.versioninfo_artifact_id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate source run and artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REQUIRE_SIGNPATH_SIGNING: ${{ inputs.require_signpath_signing }}
          SIGNPATH_ENABLED: ${{ secrets.signpath_api_token != '' }}
          SOURCE_RUN_ID: ${{ inputs.artifact_source_run_id }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
        run: |
          set -euo pipefail

          if [[ "${REQUIRE_SIGNPATH_SIGNING}" == "true" && "${SIGNPATH_ENABLED}" != "true" ]]; then
            echo "::error::Deferred signing requires signpath_api_token."
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          source_status="$(jq -r '.status' <<< "${run_json}")"
          source_conclusion="$(jq -r '.conclusion' <<< "${run_json}")"
          source_sha="$(jq -r '.head_sha' <<< "${run_json}")"
          source_event="$(jq -r '.event' <<< "${run_json}")"
          source_branch="$(jq -r '.head_branch' <<< "${run_json}")"
          source_path="$(jq -r '.path' <<< "${run_json}")"

          if [[ "${source_status}" != "completed" || "${source_conclusion}" != "success" ]]; then
            echo "::error::Source CI run ${SOURCE_RUN_ID} is not a completed successful build (${source_status}/${source_conclusion})."
            exit 1
          fi
          if [[ "${source_sha}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Source CI run ${SOURCE_RUN_ID} built ${source_sha}, not release commit ${RELEASE_COMMIT}."
            exit 1
          fi
          if [[ "${source_event}" != "push" ]]; then
            echo "::error::Source run must be a push run of .github/workflows/ci.yml (optionally @ref); got ${source_event} / ${source_path}."
            exit 1
          fi
          if [[ "${source_path}" != ".github/workflows/ci.yml" && "${source_path}" != ".github/workflows/ci.yml@"* ]]; then
            echo "::error::Source run must be a push run of .github/workflows/ci.yml (optionally @ref); got ${source_event} / ${source_path}."
            exit 1
          fi
          if [[ "${source_branch}" != "${RELEASE_TAG}" && "${source_branch}" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Source run ${SOURCE_RUN_ID} is for ref ${source_branch}, not release tag ${RELEASE_TAG}."
            exit 1
          fi

          artifacts_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          artifact_id() {
            local artifact_name="$1"
            mapfile -t ids < <(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and (.expired | not)) | .id' <<< "${artifacts_json}")
            if (( ${#ids[@]} != 1 )); then
              echo "::error::Expected exactly one unexpired '${artifact_name}' artifact in source run ${SOURCE_RUN_ID}; found ${#ids[@]}." >&2
              exit 1
            fi
            printf '%s' "${ids[0]}"
          }

          release_version="${RELEASE_VERSION#v}"
          # upload-artifact v7 names a direct archive:false upload after its file,
          # not the configured artifact name.
          direct_msi_artifact="${SYMBOL_PRODUCT_NAME}.msi"
          {
            echo "msi_name=${SYMBOL_PRODUCT_NAME}.msi"
            echo "source_run_id=${SOURCE_RUN_ID}"
            echo "symbol_pack_name=${SYMBOL_PRODUCT_NAME}Symbols-${release_version}-windows-x64.7z"
            echo "symbols_artifact_id=$(artifact_id 'windows-symbols-Windows')"
            echo "unsigned_msi_artifact_id=$(artifact_id 'unsigned-msi-package-Windows')"
            echo "unsigned_msi_signpath_artifact_id=$(artifact_id "${direct_msi_artifact}")"
            echo "versioninfo_artifact_id=$(artifact_id 'windows-versioninfo-Windows')"
          } >> "${GITHUB_OUTPUT}"

  fetch_vhf_gamepad_release:
    name: Fetch pinned VHF producer release
    if: inputs.artifact_source_run_id == ''
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout consumer verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1

      - name: Download and verify immutable producer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VHF_ARCHIVE_SHA256: 354c11239a91fd9fb2f52d45449de8409d96a4e4ed998f2794b5465eaec2434b
          VHF_DRIVER_VER: 08/21/2026,0.1.0.30
          VHF_PROTOCOL_VERSION: '2'
          VHF_SOURCE_REVISION: 52cbb8f27cbeb18baec53ca5d7b88081f0787a06
          VHF_TAG: v0.1.0-beta.2
        run: |
          $ErrorActionPreference = 'Stop'
          $gitlink = (git rev-parse "$($env:RELEASE_COMMIT):third-party/libvirtualgamepad").Trim()
          if ($LASTEXITCODE -ne 0 -or $gitlink -cne $env:VHF_SOURCE_REVISION) {
            throw "Release commit does not pin libvirtualgamepad $($env:VHF_SOURCE_REVISION); got '$gitlink'."
          }

          $packageRoot = Join-Path $env:RUNNER_TEMP 'vhf-gamepad-producer-release'
          .\scripts\download_libvirtualgamepad_release.ps1 `
            -Repository Nonary/libvirtualgamepad `
            -Tag $env:VHF_TAG `
            -ExpectedArchiveSha256 $env:VHF_ARCHIVE_SHA256 `
            -ExpectedSourceRevision $env:VHF_SOURCE_REVISION `
            -ExpectedDriverVer $env:VHF_DRIVER_VER `
            -ExpectedProtocolVersion $env:VHF_PROTOCOL_VERSION `
            -OutDir $packageRoot `
            -GitHubToken $env:GH_TOKEN

      - name: Upload verified producer package for Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vhf-gamepad-producer-release-Windows
          path: ${{ runner.temp }}\vhf-gamepad-producer-release
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}

  build_windows:
    name: ${{ matrix.name }}
    needs:
      - fetch_vhf_gamepad_release
    if: inputs.artifact_source_run_id == '' && needs.fetch_vhf_gamepad_release.result == 'success'
    runs-on: ${{ matrix.os }}
    outputs:
      msi_name: ${{ steps.package-windows-msi.outputs.msi_name }}
      symbol_pack_name: ${{ steps.package-windows-symbols.outputs.symbol_pack_name }}
      symbols_artifact_id: ${{ steps.upload-windows-symbols.outputs.artifact-id }}
      unsigned_msi_artifact_id: ${{ steps.upload-unsigned-msi-for-package.outputs.artifact-id }}
      unsigned_msi_signpath_artifact_id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
      versioninfo_artifact_id: ${{ steps.upload-windows-version-metadata.outputs.artifact-id }}
    env:
      NODE_VERSION: 22.22.2
      SIGNPATH_ENABLED: ${{ secrets.signpath_api_token != '' }}
      SIGNPATH_ORGANIZATION_ID: ${{ inputs.signpath_organization_id }}
      SIGNPATH_PROJECT_SLUG: ${{ inputs.signpath_project_slug }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signpath_signing_policy_slug }}
      SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG: ${{ inputs.signpath_msi_artifact_configuration_slug }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ inputs.signpath_artifact_configuration_slug }}
      VIBEPOLLO_DEPS_DIR: ${{ github.workspace }}\.vibepollo-deps
      WEBRTC_ROOT: ${{ github.workspace }}\.vibepollo-deps\libwebrtc\out
      TRUEHDR_RUNTIME_ROOT: ${{ github.workspace }}\.vibeshine-deps\truehdr-runtime
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            arch: x86_64
            msystem: ucrt64
            toolchain: ucrt-x86_64
    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
          submodules: recursive

      - name: Test VHF publisher trust policy
        shell: pwsh
        run: .\packaging\windows\virtual_gamepad_driver\tests\test_publisher_trust.ps1

      - name: Test VHF manifest channel contract
        shell: pwsh
        run: .\packaging\windows\virtual_gamepad_driver\tests\test_manifest_channel_contract.ps1

      - name: Test VHF CMake release contract
        shell: pwsh
        run: cmake -P .\packaging\windows\virtual_gamepad_driver\tests\test_release_contract.cmake

      - name: Test WiX sortable ProductCode contract
        shell: pwsh
        run: cmake -P .\packaging\windows\wix\tests\test_sortable_product_guid_contract.cmake

      - name: Download verified VHF producer package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: vhf-gamepad-producer-release-Windows
          path: ${{ runner.temp }}\vhf-gamepad-producer-release

      - name: Revalidate VHF producer package for packaging
        shell: pwsh
        env:
          VHF_ARCHIVE_SHA256: 354c11239a91fd9fb2f52d45449de8409d96a4e4ed998f2794b5465eaec2434b
          VHF_DRIVER_VER: 08/21/2026,0.1.0.30
          VHF_PROTOCOL_VERSION: '2'
          VHF_SOURCE_REVISION: 52cbb8f27cbeb18baec53ca5d7b88081f0787a06
          VHF_TAG: v0.1.0-beta.2
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'vhf-gamepad-producer-release'
          .\scripts\download_libvirtualgamepad_release.ps1 `
            -ValidateOnly `
            -Repository Nonary/libvirtualgamepad `
            -Tag $env:VHF_TAG `
            -ExpectedArchiveSha256 $env:VHF_ARCHIVE_SHA256 `
            -ExpectedSourceRevision $env:VHF_SOURCE_REVISION `
            -ExpectedDriverVer $env:VHF_DRIVER_VER `
            -ExpectedProtocolVersion $env:VHF_PROTOCOL_VERSION `
            -OutDir $packageRoot
          "VHF_PACKAGE_ROOT=$packageRoot" >> $env:GITHUB_ENV

      - name: Resolve Windows build version
        shell: pwsh
        env:
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $buildVersion = $env:INPUT_RELEASE_VERSION

          if ([string]::IsNullOrWhiteSpace($buildVersion)) {
            if ($env:GITHUB_REF_VALUE -like 'refs/tags/*' -and -not [string]::IsNullOrWhiteSpace($env:GITHUB_REF_NAME_VALUE)) {
              $buildVersion = $env:GITHUB_REF_NAME_VALUE
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildVersion)) {
            $buildVersion = '0.0.0'
          }

          if ($buildVersion -match '^v(.+)$') {
            $buildVersion = $Matches[1]
          }

          "Resolved Windows build version: $buildVersion"
          "BUILD_VERSION=$buildVersion" >> $env:GITHUB_ENV

      - name: Setup Dependencies Windows
        id: setup-msys2
        # if a dependency needs to be pinned, see https://github.com/LizardByte/build-deps/pull/186
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda  # v2.30.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: >-
            git
            mingw-w64-${{ matrix.toolchain }}-boost
            mingw-w64-${{ matrix.toolchain }}-cmake
            mingw-w64-${{ matrix.toolchain }}-cppwinrt
            mingw-w64-${{ matrix.toolchain }}-curl-winssl
            mingw-w64-${{ matrix.toolchain }}-gcc
            mingw-w64-${{ matrix.toolchain }}-MinHook
            mingw-w64-${{ matrix.toolchain }}-miniupnpc
            mingw-w64-${{ matrix.toolchain }}-ninja
            mingw-w64-${{ matrix.toolchain }}-nlohmann-json
            mingw-w64-${{ matrix.toolchain }}-onevpl
            mingw-w64-${{ matrix.toolchain }}-openssl
            mingw-w64-${{ matrix.toolchain }}-opus
            mingw-w64-${{ matrix.toolchain }}-sqlite3
            mingw-w64-${{ matrix.toolchain }}-tools

      - name: Setup dotnet  # needed for wix
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309  # v5.1.0
        with:
          dotnet-version: '10.x'

      - name: Setup NodeJS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src_assets/common/assets/web/package-lock.json
            src_assets/common/assets/web-legacy/package-lock.json

      - name: NodeJS Path
        shell: pwsh
        run: |
          $nodeBinaryPath = (Get-Command node).Source
          $nodePath = Split-Path -Path $nodeBinaryPath -Parent
          "NODEJS_PATH=$nodePath" >> $env:GITHUB_ENV
          "nodejs-path=$nodePath"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y

      - name: Resolve WebRTC toolchain
        shell: pwsh
        env:
          MATRIX_MSYSTEM: ${{ matrix.msystem }}
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath) -or -not (Test-Path -LiteralPath $vsPath)) {
            throw 'Visual Studio with the VC toolchain was not found.'
          }

          $kitsRoot = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10).KitsRoot10
          if ([string]::IsNullOrWhiteSpace($kitsRoot) -or -not (Test-Path -LiteralPath $kitsRoot)) {
            throw 'Windows SDK KitsRoot10 was not found.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MSYS2_LOCATION) -or -not (Test-Path -LiteralPath $env:MSYS2_LOCATION)) {
            throw "MSYS2 location was not found: $($env:MSYS2_LOCATION)"
          }

          $msys2Bin = Join-Path $env:MSYS2_LOCATION "$($env:MATRIX_MSYSTEM)\bin"
          if (-not (Test-Path -LiteralPath $msys2Bin)) {
            throw "MSYS2 bin directory was not found: $msys2Bin"
          }

          "WEBRTC_VS_PATH=$vsPath" >> $env:GITHUB_ENV
          "WEBRTC_WINSDK_DIR=$kitsRoot" >> $env:GITHUB_ENV
          "WEBRTC_MSYS2_BIN=$msys2Bin" >> $env:GITHUB_ENV

      - name: Download virtual display driver package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LIBVIRTUALDISPLAY_RELEASE_TAG: v1.6.3
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = Join-Path $PWD 'libvirtualdisplay-release'
          .\scripts\download_libvirtualdisplay_release.ps1 `
            -Repository Nonary/libvirtualdisplay `
            -Tag $env:LIBVIRTUALDISPLAY_RELEASE_TAG `
            -OutDir $downloadDir `
            -GitHubToken $env:GH_TOKEN
          "VDD_PREBUILT_PACKAGE_DIR=$downloadDir" >> $env:GITHUB_ENV
          "Using virtual display driver package: $downloadDir"

      - name: Download pinned WebRTC artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          .\scripts\download_webrtc_release.ps1 `
            -ManifestPath .\third-party\webrtc-artifacts\windows-x64.json `
            -OutDir $env:WEBRTC_ROOT `
            -GitHubToken $env:GH_TOKEN

      - name: Download pinned TrueHDR runtime
        if: inputs.require_truehdr_runtime
        shell: pwsh
        env:
          TRUEHDR_RUNTIME_TOKEN: ${{ secrets.truehdr_runtime_token || github.token }}
          TRUEHDR_RUNTIME_RELEASE_REPO: ${{ inputs.truehdr_runtime_release_repo }}
          TRUEHDR_RUNTIME_RELEASE_TAG: ${{ inputs.truehdr_runtime_release_tag }}
          TRUEHDR_RUNTIME_ASSET_NAME: ${{ inputs.truehdr_runtime_asset_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $args = @{
            Repository = $env:TRUEHDR_RUNTIME_RELEASE_REPO
            Tag = $env:TRUEHDR_RUNTIME_RELEASE_TAG
            OutDir = $env:TRUEHDR_RUNTIME_ROOT
            GitHubToken = $env:TRUEHDR_RUNTIME_TOKEN
          }
          if (-not [string]::IsNullOrWhiteSpace($env:TRUEHDR_RUNTIME_ASSET_NAME)) {
            $args.AssetName = $env:TRUEHDR_RUNTIME_ASSET_NAME
          }

          .\scripts\download_truehdr_runtime_release.ps1 @args
          "SUNSHINE_TRUEHDR_RUNTIME_DIR=$env:TRUEHDR_RUNTIME_ROOT" >> $env:GITHUB_ENV

      - name: Build Windows
        shell: msys2 {0}
        env:
          # MSYSTEM is a built-in environment variable of MSYS2.
          # Do not use this environment variable name.
          MATRIX_MSYSTEM: ${{ matrix.msystem }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ inputs.release_commit }}
          REQUIRE_TRUEHDR_RUNTIME: ${{ inputs.require_truehdr_runtime }}
        run: |
          echo "Using BUILD_VERSION=${BUILD_VERSION}"

          NODEJS_PATH=$(cygpath -u "$NODEJS_PATH")
          export PATH="${NODEJS_PATH}:$PATH"
          NPM_PATH="$(cygpath -m "${NODEJS_PATH}/npm.cmd")"
          echo "Using node: $(command -v node) ($(node --version))"
          echo "Using npm: ${NPM_PATH} ($(npm --version))"

          vdd_prebuilt_arg=()
          if [[ -n "${VDD_PREBUILT_PACKAGE_DIR:-}" ]]; then
            vdd_prebuilt_arg=(-DSUNSHINE_LIBVIRTUALDISPLAY_PREBUILT_DIR="$(cygpath -u "${VDD_PREBUILT_PACKAGE_DIR}")")
            echo "Using prebuilt virtual display driver package: ${VDD_PREBUILT_PACKAGE_DIR}"
          fi
          if [[ -z "${VHF_PACKAGE_ROOT:-}" ]]; then
            echo "Verified VHF producer package path is missing." >&2
            exit 1
          fi
          vhf_gamepad_package_arg=(
            -DSUNSHINE_BUNDLE_VHF_GAMEPAD_DRIVER=ON
            -DSUNSHINE_LIBVIRTUALGAMEPAD_PREBUILT_DIR="$(cygpath -u "${VHF_PACKAGE_ROOT}")"
            -DSUNSHINE_VHF_GAMEPAD_RELEASE_TAG=v0.1.0-beta.2
            -DSUNSHINE_VHF_GAMEPAD_RELEASE_ASSET_SHA256=354c11239a91fd9fb2f52d45449de8409d96a4e4ed998f2794b5465eaec2434b
            -DSUNSHINE_VHF_GAMEPAD_SOURCE_REVISION=52cbb8f27cbeb18baec53ca5d7b88081f0787a06
            -DSUNSHINE_VHF_GAMEPAD_DRIVER_VER=08/21/2026,0.1.0.30
            -DSUNSHINE_VHF_GAMEPAD_PROTOCOL_VERSION=2
          )
          echo "Using verified VHF producer release v0.1.0-beta.2"
          truehdr_runtime_arg=()
          if [[ "${REQUIRE_TRUEHDR_RUNTIME}" == "true" ]]; then
            truehdr_runtime_arg=(
              -DSUNSHINE_TRUEHDR_RUNTIME_DIR="$(cygpath -u "${SUNSHINE_TRUEHDR_RUNTIME_DIR}")"
              -DSUNSHINE_REQUIRE_TRUEHDR_RUNTIME=ON
            )
            echo "Using pinned TrueHDR runtime: ${SUNSHINE_TRUEHDR_RUNTIME_DIR}"
          fi

          mkdir -p build
          # Release tag builds omit test targets; ordinary reusable-workflow calls retain them.
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_WERROR=ON \
            -DBUILD_TESTS=${{ inputs.build_tests && 'ON' || 'OFF' }} \
            -DBUILD_SUNSHINE_VIRTUAL_DISPLAY_DRIVER=OFF \
            -DBUILD_VIRTUALDISPLAY_PROBE=OFF \
            -DBUILD_VIRTUALDISPLAY_TOOLS=OFF \
            -DBUILD_VIRTUALDISPLAY_VULKAN_LAYER=OFF \
            -DBUILD_DOCS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ENABLE_WEBRTC=ON \
            -DWEBRTC_ROOT="$(cygpath -u "${WEBRTC_ROOT}")" \
            -DWEBRTC_INCLUDE_DIR="$(cygpath -u "${WEBRTC_ROOT}")/include" \
            -DWEBRTC_LIBRARY="$(cygpath -u "${WEBRTC_ROOT}")/lib/libwebrtc.dll.a" \
            -DWEBRTC_MSYS2_BIN="$(cygpath -u "${WEBRTC_MSYS2_BIN}")" \
            -DWEBRTC_VS_PATH="$(cygpath -u "${WEBRTC_VS_PATH}")" \
            -DWEBRTC_WINSDK_DIR="$(cygpath -u "${WEBRTC_WINSDK_DIR}")" \
            -DSUNSHINE_NPM_EXECUTABLE="${NPM_PATH}" \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://app.lizardbyte.dev" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://app.lizardbyte.dev/support" \
            "${vdd_prebuilt_arg[@]}" \
            "${vhf_gamepad_package_arg[@]}" \
            "${truehdr_runtime_arg[@]}"
          echo "::add-matcher::.github/matchers/gcc.json"
          cmake --build build --target all -j "$(nproc)"
          echo "::remove-matcher owner=gcc::"

      - name: Test native AMF lifecycle behavior
        shell: msys2 {0}
        run: |
          set -euo pipefail
          c++ \
            -std=gnu++23 \
            -O2 \
            -pthread \
            -DSUNSHINE_AMF_LIFECYCLE_STANDALONE \
            -I. \
            tests/unit/platform/windows/test_native_amf_review.cpp \
            -o build/native-amf-lifecycle-test.exe
          ./build/native-amf-lifecycle-test.exe

      - name: Install cv2pdb
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        shell: pwsh
        env:
          CV2PDB_VERSION: "0.54"
        run: |
          $ErrorActionPreference = 'Stop'
          $cv2pdbDir = Join-Path $env:RUNNER_TEMP 'cv2pdb'
          $cv2pdbZip = Join-Path $env:RUNNER_TEMP 'cv2pdb.zip'
          $cv2pdbUrl = "https://github.com/rainers/cv2pdb/releases/download/v${env:CV2PDB_VERSION}/cv2pdb-${env:CV2PDB_VERSION}.zip"

          Invoke-WebRequest -Uri $cv2pdbUrl -OutFile $cv2pdbZip
          Expand-Archive -Path $cv2pdbZip -DestinationPath $cv2pdbDir -Force
          $cv2pdbExe = Get-ChildItem -Path $cv2pdbDir -Recurse -Filter cv2pdb64.exe -File | Select-Object -First 1
          if (-not $cv2pdbExe) {
            throw 'cv2pdb64.exe was not found in the downloaded archive.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $cv2pdbExe.FullName -Parent)

      - name: Generate Windows PDB
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $executables = @(
            '.\build\sunshine.exe',
            '.\build\tools\audio-info.exe',
            '.\build\tools\dxgi-info.exe',
            '.\build\tools\playnite-launcher.exe',
            '.\build\tools\sunshine_display_helper.exe',
            '.\build\tools\sunshine_wgc_capture.exe',
            '.\build\tools\sunshinesvc.exe'
          )

          foreach ($exe in $executables) {
            if (Test-Path -LiteralPath $exe) {
              & cv2pdb64.exe $exe
            }
          }

          $sunshineSvc = '.\build\tools\sunshinesvc.exe'
          $sunshineSvcPayload = '.\build\wix_payload\tools\sunshinesvc.exe'
          if ((Test-Path -LiteralPath $sunshineSvc) -and (Test-Path -LiteralPath $sunshineSvcPayload)) {
            Copy-Item -LiteralPath $sunshineSvc -Destination $sunshineSvcPayload -Force
          }

      - name: Package Windows Symbols
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        id: package-windows-symbols
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseVersion = $env:RELEASE_VERSION
          if ($releaseVersion -match '^v(.+)$') {
            $releaseVersion = $Matches[1]
          }

          $symbolsRoot = Join-Path $PWD 'symbols'
          $artifactName = "$($env:SYMBOL_PRODUCT_NAME)Symbols-$releaseVersion-windows-x64.7z"
          $artifactPath = Join-Path $symbolsRoot $artifactName
          "symbol_pack_name=$artifactName" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Force -Path $symbolsRoot | Out-Null

          $pdbFiles = Get-ChildItem -Path build -Recurse -Filter *.pdb -File |
            Where-Object { $_.FullName -notlike '*\cpack_artifacts\*' }

          if (-not $pdbFiles) {
            throw 'No PDB files were produced.'
          }

          $buildRoot = (Resolve-Path build).Path
          $pdbPaths = @($pdbFiles | ForEach-Object { [System.IO.Path]::GetRelativePath($buildRoot, $_.FullName) })
          Push-Location $buildRoot
          try {
            & 7z a $artifactPath $pdbPaths
          } finally {
            Pop-Location
          }

      - name: Strip Windows binaries
        shell: msys2 {0}
        run: |
          set -euo pipefail

          mapfile -d '' binaries < <(
            find build -type f \( -name '*.exe' -o -name '*.dll' \) \
              ! -path '*/cpack_artifacts/*' \
              ! -path '*/CMakeFiles/*' \
              ! -path '*/_deps/*' \
              ! -path '*/tests/*' \
              -print0
          )

          if (( ${#binaries[@]} == 0 )); then
            echo "No Windows binaries found to strip."
            exit 0
          fi

          strip --strip-debug --strip-unneeded "${binaries[@]}"

          for binary in "${binaries[@]}"; do
            if objdump -h "${binary}" | grep -Eq ' \.(debug|zdebug)'; then
              echo "Unstripped debug sections remain in ${binary}" >&2
              exit 1
            fi
          done

      # WiX already installed before configure so env:WIX is available

      - name: Validate SignPath configuration
        shell: msys2 {0}
        env:
          REQUIRE_SIGNPATH_SIGNING: ${{ inputs.require_signpath_signing }}
        run: |
          set -euo pipefail

          if [[ "${REQUIRE_SIGNPATH_SIGNING}" == "true" && "${SIGNPATH_ENABLED}" != "true" ]]; then
            echo "SignPath signing is required for this run, but signpath_api_token was not provided." >&2
            exit 1
          fi

          if [[ "${SIGNPATH_ENABLED}" == "true" ]]; then
            echo "Windows installer will be submitted to SignPath after GitHub artifact upload."
            echo "SignPath project: ${SIGNPATH_PROJECT_SLUG} / ${SIGNPATH_SIGNING_POLICY_SLUG}"
            echo "Two origin-verified requests: (1) MSI deep-sign '${SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG}', (2) setup EXE '${SIGNPATH_ARTIFACT_CONFIGURATION_SLUG}'."
            echo "Both artifact configurations must exist in the SignPath portal (see docs/signpath/)."
            if [[ -z "${SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG}" ]]; then
              echo "signpath_msi_artifact_configuration_slug is required so SignPath can deep-sign the MSI payload (sunshine.exe, tools, uninstall.exe, DLLs)." >&2
              exit 1
            fi
            if [[ -z "${SIGNPATH_ARTIFACT_CONFIGURATION_SLUG}" ]]; then
              echo "signpath_artifact_configuration_slug is required so SignPath can sign the outer setup EXE with an explicit PE configuration." >&2
              exit 1
            fi
          else
            echo "signpath_api_token was not provided; Windows installer artifact will remain unsigned."
          fi

      - name: Package Windows MSI
        id: package-windows-msi
        shell: msys2 {0}
        run: |
          mkdir -p unsigned-signpath-msi
          cd build

          set -euo pipefail

          # Build only the MSI first. SignPath credentials stay out of this
          # step so the MSI is signed from a GitHub artifact with origin
          # verification, including nested files such as uninstall.exe.
          cmake --build . --target package_msi -j "$(nproc)"

          msi_path=$(ls -t ./cpack_artifacts/*.msi 2>/dev/null | head -n 1 || true)
          if [[ -z "${msi_path}" ]]; then
            echo "Expected MSI was not produced." >&2
            find ./cpack_artifacts -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi

          msi_name="$(basename "${msi_path}")"
          cp "${msi_path}" "../unsigned-signpath-msi/${msi_name}"
          echo "msi_name=${msi_name}" >> "${GITHUB_OUTPUT}"

      - name: Verify unsigned MSI contains the pinned VHF package
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.package-windows-msi.outputs.msi_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'unsigned-vhf-msi-extract'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          $msiPath = Join-Path $PWD "unsigned-signpath-msi\$($env:MSI_NAME)"
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msiPath, '/qn', "TARGETDIR=$extractRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Administrative extraction of unsigned MSI failed with exit code $($process.ExitCode)."
          }
          $packageDir = Join-Path $extractRoot 'Apollo\drivers\vhf-gamepad'
          .\packaging\windows\virtual_gamepad_driver\refresh_driver_package.ps1 `
            -ValidateOnly `
            -PrebuiltPackageDir $env:VHF_PACKAGE_ROOT `
            -PackageDir $packageDir `
            -ReleaseTag v0.1.0-beta.2 `
            -ExpectedReleaseAssetSha256 354c11239a91fd9fb2f52d45449de8409d96a4e4ed998f2794b5465eaec2434b `
            -ExpectedSourceRevision 52cbb8f27cbeb18baec53ca5d7b88081f0787a06 `
            -ExpectedDriverVer '08/21/2026,0.1.0.30' `
            -ExpectedProtocolVersion 2
          $expected = @(
            'cleanup.ps1',
            'driver/VibeshineVhfGamepad.cat',
            'driver/VibeshineVhfGamepad.dll',
            'driver/VibeshineVhfGamepad.inf',
            'install.ps1',
            'manifest.json',
            'release-lock.json',
            'tools/VibeshineVhfGamepadDeviceSetup.exe'
          )
          $actual = @(Get-ChildItem -LiteralPath $packageDir -Recurse -File | ForEach-Object {
            $_.FullName.Substring($packageDir.Length).TrimStart('\', '/').Replace('\', '/')
          } | Sort-Object)
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw "Unsigned MSI VHF layout is not exact: $($actual -join ', ')"
          }

      - name: Upload unsigned MSI for SignPath
        id: upload-unsigned-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-msi-${{ matrix.name }}
          path: unsigned-signpath-msi/${{ steps.package-windows-msi.outputs.msi_name }}
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}
          archive: false
          overwrite: true

      - name: Upload unsigned MSI for package job
        id: upload-unsigned-msi-for-package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-msi-package-${{ matrix.name }}
          path: unsigned-signpath-msi/${{ steps.package-windows-msi.outputs.msi_name }}
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}
          overwrite: true

      - name: Upload Windows symbols package
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        id: upload-windows-symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-symbols-${{ matrix.name }}
          path: symbols/${{ steps.package-windows-symbols.outputs.symbol_pack_name }}
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}
          overwrite: true

      - name: Upload Windows version metadata
        id: upload-windows-version-metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-versioninfo-${{ matrix.name }}
          path: build/generated_versioninfo/windows_versioninfo_generated.h
          if-no-files-found: error
          retention-days: ${{ inputs.release_artifact_retention_days }}
          overwrite: true

      - name: Debug wix
        if: always() && steps.package-windows-msi.outcome == 'failure'
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'build\cpack_artifacts\_CPack_Packages\win64\WIX\wix.log'
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          } else {
            Write-Host "WiX log was not found: $log"
          }

  release_artifacts:
    name: Select release artifacts
    needs:
      - build_windows
      - resolve_source_artifacts
    if: >-
      ${{ always() && !cancelled() &&
          ((inputs.artifact_source_run_id == '' && needs.build_windows.result == 'success') ||
           (inputs.artifact_source_run_id != '' && needs.resolve_source_artifacts.result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      msi_name: ${{ steps.select.outputs.msi_name }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
      symbol_pack_name: ${{ steps.select.outputs.symbol_pack_name }}
      symbols_artifact_id: ${{ steps.select.outputs.symbols_artifact_id }}
      unsigned_msi_artifact_id: ${{ steps.select.outputs.unsigned_msi_artifact_id }}
      unsigned_msi_signpath_artifact_id: ${{ steps.select.outputs.unsigned_msi_signpath_artifact_id }}
      versioninfo_artifact_id: ${{ steps.select.outputs.versioninfo_artifact_id }}
    steps:
      - name: Select current or deferred build
        id: select
        env:
          DEFERRED_MSI_NAME: ${{ needs.resolve_source_artifacts.outputs.msi_name }}
          DEFERRED_SOURCE_RUN_ID: ${{ needs.resolve_source_artifacts.outputs.source_run_id }}
          DEFERRED_SYMBOL_PACK_NAME: ${{ needs.resolve_source_artifacts.outputs.symbol_pack_name }}
          DEFERRED_SYMBOLS_ARTIFACT_ID: ${{ needs.resolve_source_artifacts.outputs.symbols_artifact_id }}
          DEFERRED_UNSIGNED_MSI_PACKAGE_ARTIFACT_ID: ${{ needs.resolve_source_artifacts.outputs.unsigned_msi_artifact_id }}
          DEFERRED_UNSIGNED_MSI_ARTIFACT_ID: ${{ needs.resolve_source_artifacts.outputs.unsigned_msi_signpath_artifact_id }}
          DEFERRED_VERSIONINFO_ARTIFACT_ID: ${{ needs.resolve_source_artifacts.outputs.versioninfo_artifact_id }}
          CURRENT_MSI_NAME: ${{ needs.build_windows.outputs.msi_name }}
          CURRENT_SYMBOL_PACK_NAME: ${{ needs.build_windows.outputs.symbol_pack_name }}
          CURRENT_SYMBOLS_ARTIFACT_ID: ${{ needs.build_windows.outputs.symbols_artifact_id }}
          CURRENT_UNSIGNED_MSI_PACKAGE_ARTIFACT_ID: ${{ needs.build_windows.outputs.unsigned_msi_artifact_id }}
          CURRENT_UNSIGNED_MSI_ARTIFACT_ID: ${{ needs.build_windows.outputs.unsigned_msi_signpath_artifact_id }}
          CURRENT_VERSIONINFO_ARTIFACT_ID: ${{ needs.build_windows.outputs.versioninfo_artifact_id }}
          REQUESTED_SOURCE_RUN_ID: ${{ inputs.artifact_source_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_SOURCE_RUN_ID}" ]]; then
            prefix=DEFERRED
          else
            prefix=CURRENT
          fi

          msi_name_var="${prefix}_MSI_NAME"
          symbol_pack_var="${prefix}_SYMBOL_PACK_NAME"
          symbols_id_var="${prefix}_SYMBOLS_ARTIFACT_ID"
          unsigned_msi_package_id_var="${prefix}_UNSIGNED_MSI_PACKAGE_ARTIFACT_ID"
          unsigned_msi_id_var="${prefix}_UNSIGNED_MSI_ARTIFACT_ID"
          versioninfo_id_var="${prefix}_VERSIONINFO_ARTIFACT_ID"
          source_run_id="${DEFERRED_SOURCE_RUN_ID:-${GITHUB_RUN_ID}}"
          {
            echo "msi_name=${!msi_name_var}"
            echo "source_run_id=${source_run_id}"
            echo "symbol_pack_name=${!symbol_pack_var}"
            echo "symbols_artifact_id=${!symbols_id_var}"
            echo "unsigned_msi_artifact_id=${!unsigned_msi_package_id_var}"
            echo "unsigned_msi_signpath_artifact_id=${!unsigned_msi_id_var}"
            echo "versioninfo_artifact_id=${!versioninfo_id_var}"
          } >> "${GITHUB_OUTPUT}"

  sign_windows_msi:
    name: Sign Windows MSI
    needs:
      - release_artifacts
    if: always() && !cancelled() && inputs.build_only == false && needs.release_artifacts.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      signed_msi_artifact_id: ${{ steps.upload-signed-msi.outputs.artifact-id }}
    env:
      SIGNPATH_ENABLED: ${{ secrets.signpath_api_token != '' }}
      SIGNPATH_ORGANIZATION_ID: ${{ inputs.signpath_organization_id }}
      SIGNPATH_PROJECT_SLUG: ${{ inputs.signpath_project_slug }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signpath_signing_policy_slug }}
      SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG: ${{ inputs.signpath_msi_artifact_configuration_slug }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout signing helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Download deferred unsigned MSI for SignPath
        if: inputs.artifact_source_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.release_artifacts.outputs.unsigned_msi_artifact_id }}
          github-token: ${{ github.token }}
          path: deferred-signpath-msi
          run-id: ${{ needs.release_artifacts.outputs.source_run_id }}

      - name: Re-upload deferred unsigned MSI for SignPath
        if: inputs.artifact_source_run_id != ''
        id: upload-deferred-unsigned-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deferred-unsigned-msi-Windows
          path: deferred-signpath-msi/${{ needs.release_artifacts.outputs.msi_name }}
          if-no-files-found: error
          retention-days: 1
          archive: false
          overwrite: true

      - name: Select current-run SignPath MSI artifact
        id: select-signpath-msi-artifact
        shell: pwsh
        env:
          CURRENT_ARTIFACT_ID: ${{ needs.release_artifacts.outputs.unsigned_msi_signpath_artifact_id }}
          DEFERRED_ARTIFACT_ID: ${{ steps.upload-deferred-unsigned-msi.outputs.artifact-id }}
          DEFERRED_BUILD: ${{ inputs.artifact_source_run_id != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactId = if ($env:DEFERRED_BUILD -eq 'true') {
            $env:DEFERRED_ARTIFACT_ID
          } else {
            $env:CURRENT_ARTIFACT_ID
          }
          if ([string]::IsNullOrWhiteSpace($artifactId)) {
            throw 'The current-run SignPath MSI artifact ID was not resolved.'
          }
          "artifact_id=$artifactId" >> $env:GITHUB_OUTPUT

      - name: Submit and wait for SignPath MSI signing request
        if: env.SIGNPATH_ENABLED == 'true'
        uses: ./.github/actions/signpath-submit-and-wait
        with:
          api-token: ${{ secrets.signpath_api_token }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.select-signpath-msi-artifact.outputs.artifact_id }}
          github-token: ${{ github.token }}
          output-artifact-path: signed-signpath-msi/${{ needs.release_artifacts.outputs.msi_name }}
          timeout-seconds: ${{ inputs.signpath_wait_for_completion_timeout_in_seconds }}

      - name: Stage signed Windows MSI
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          MSI_NAME: ${{ needs.release_artifacts.outputs.msi_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $signedRoot = Join-Path $PWD 'signed-signpath-msi'
          if (-not (Test-Path -LiteralPath $signedRoot)) {
            throw "SignPath MSI output directory was not created: $signedRoot"
          }

          $matches = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter $env:MSI_NAME)
          if ($matches.Count -ne 1) {
            Get-ChildItem -LiteralPath $signedRoot -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one signed MSI named '$($env:MSI_NAME)', found $($matches.Count)."
          }

          $msiDir = Join-Path $PWD 'signed-msi'
          New-Item -ItemType Directory -Path $msiDir -Force | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination (Join-Path $msiDir $env:MSI_NAME) -Force

      - name: Upload signed MSI
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-signed-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-msi-Windows
          path: signed-msi/${{ needs.release_artifacts.outputs.msi_name }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: SignPath disabled
        if: env.SIGNPATH_ENABLED != 'true'
        run: Write-Host "SignPath token was not provided; MSI will remain unsigned."

  package_windows:
    name: Package Windows
    needs:
      - release_artifacts
      - sign_windows_msi
    if: always() && !cancelled() && needs.release_artifacts.result == 'success' && needs.sign_windows_msi.result == 'success'
    runs-on: windows-2022
    outputs:
      installer_name: ${{ steps.package-windows.outputs.installer_name }}
      unsigned_installer_artifact_id: ${{ steps.upload-unsigned-installer-for-finalize.outputs.artifact-id }}
      unsigned_installer_signpath_artifact_id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
    env:
      SIGNPATH_ENABLED: ${{ secrets.signpath_api_token != '' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1

      - name: Download signed MSI
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.sign_windows_msi.outputs.signed_msi_artifact_id }}
          path: signed-msi

      - name: Download unsigned MSI
        if: env.SIGNPATH_ENABLED != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.release_artifacts.outputs.unsigned_msi_artifact_id }}
          github-token: ${{ github.token }}
          path: signed-msi
          run-id: ${{ needs.release_artifacts.outputs.source_run_id }}

      - name: Download Windows version metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.release_artifacts.outputs.versioninfo_artifact_id }}
          github-token: ${{ github.token }}
          path: build/generated_versioninfo
          run-id: ${{ needs.release_artifacts.outputs.source_run_id }}

      - name: Package Windows
        id: package-windows
        shell: pwsh
        env:
          MSI_NAME: ${{ needs.release_artifacts.outputs.msi_name }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $installerName = "$($env:SYMBOL_PRODUCT_NAME)Setup.exe"
          $signedMsi = Join-Path (Join-Path $PWD 'signed-msi') $env:MSI_NAME
          if (-not (Test-Path -LiteralPath $signedMsi)) {
            throw "MSI artifact was not downloaded: $signedMsi"
          }

          New-Item -ItemType Directory -Path (Join-Path $PWD 'build') -Force | Out-Null
          & (Join-Path $PWD 'packaging/windows/bootstrapper/build_bootstrapper.ps1') `
            -BuildDir (Join-Path $PWD 'build') `
            -MsiPath $signedMsi `
            -OutputName $installerName `
            -DisableSignPath

          $installerExe = Join-Path (Join-Path $PWD 'build/cpack_artifacts') $installerName
          if (-not (Test-Path -LiteralPath $installerExe)) {
            Get-ChildItem -Path (Join-Path $PWD 'build/cpack_artifacts') -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "Expected setup executable was not produced: $installerExe"
          }

          $unsignedDir = Join-Path $PWD 'unsigned-signpath'
          New-Item -ItemType Directory -Path $unsignedDir -Force | Out-Null
          Copy-Item -LiteralPath $installerExe -Destination (Join-Path $unsignedDir $installerName) -Force
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-installer-Windows
          path: unsigned-signpath/${{ steps.package-windows.outputs.installer_name }}
          if-no-files-found: error
          retention-days: 1
          archive: false
          overwrite: true

      - name: Upload unsigned installer for finalize job
        id: upload-unsigned-installer-for-finalize
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-installer-finalize-Windows
          path: unsigned-signpath/${{ steps.package-windows.outputs.installer_name }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sign_windows_installer:
    name: Sign Windows installer
    needs:
      - package_windows
    if: always() && !cancelled() && needs.package_windows.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      signed_installer_artifact_id: ${{ steps.upload-signed-installer.outputs.artifact-id }}
    env:
      SIGNPATH_ENABLED: ${{ secrets.signpath_api_token != '' }}
      SIGNPATH_ORGANIZATION_ID: ${{ inputs.signpath_organization_id }}
      SIGNPATH_PROJECT_SLUG: ${{ inputs.signpath_project_slug }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signpath_signing_policy_slug }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ inputs.signpath_artifact_configuration_slug }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout signing helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Submit and wait for SignPath installer signing request
        if: env.SIGNPATH_ENABLED == 'true'
        uses: ./.github/actions/signpath-submit-and-wait
        with:
          api-token: ${{ secrets.signpath_api_token }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.package_windows.outputs.unsigned_installer_signpath_artifact_id }}
          github-token: ${{ github.token }}
          output-artifact-path: signed-signpath/${{ needs.package_windows.outputs.installer_name }}
          timeout-seconds: ${{ inputs.signpath_wait_for_completion_timeout_in_seconds }}

      - name: Stage signed Windows installer
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          INSTALLER_NAME: ${{ needs.package_windows.outputs.installer_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $signedRoot = Join-Path $PWD 'signed-signpath'
          if (-not (Test-Path -LiteralPath $signedRoot)) {
            throw "SignPath output directory was not created: $signedRoot"
          }

          $matches = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter $env:INSTALLER_NAME)
          if ($matches.Count -ne 1) {
            Get-ChildItem -LiteralPath $signedRoot -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one signed installer named '$($env:INSTALLER_NAME)', found $($matches.Count)."
          }

          $artifactDir = Join-Path $PWD 'signed-installer'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination (Join-Path $artifactDir $env:INSTALLER_NAME) -Force

      - name: Upload signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-signed-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-installer-Windows
          path: signed-installer/${{ needs.package_windows.outputs.installer_name }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: SignPath disabled
        if: env.SIGNPATH_ENABLED != 'true'
        run: Write-Host "SignPath token was not provided; installer will remain unsigned."

  finalize_windows:
    name: Finalize Windows artifacts
    needs:
      - release_artifacts
      - sign_windows_msi
      - package_windows
      - sign_windows_installer
    if: always() && !cancelled() && needs.release_artifacts.result == 'success' && needs.sign_windows_msi.result == 'success' && needs.package_windows.result == 'success' && needs.sign_windows_installer.result == 'success'
    runs-on: windows-2022
    env:
      SIGNPATH_ENABLED: ${{ secrets.signpath_api_token != '' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.sign_windows_installer.outputs.signed_installer_artifact_id }}
          path: artifacts

      - name: Download unsigned installer
        if: env.SIGNPATH_ENABLED != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.package_windows.outputs.unsigned_installer_artifact_id }}
          path: artifacts

      - name: Download signed MSI
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.sign_windows_msi.outputs.signed_msi_artifact_id }}
          path: signed-msi

      - name: Download symbols package
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols || inputs.upload_symbols_artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          artifact-ids: ${{ needs.release_artifacts.outputs.symbols_artifact_id }}
          github-token: ${{ github.token }}
          path: symbols
          run-id: ${{ needs.release_artifacts.outputs.source_run_id }}

      - name: Include symbols in build artifact
        if: inputs.upload_symbols_artifact
        shell: pwsh
        env:
          SYMBOL_PACK_NAME: ${{ needs.release_artifacts.outputs.symbol_pack_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $symbolPack = Join-Path (Join-Path $PWD 'symbols') $env:SYMBOL_PACK_NAME
          if (-not (Test-Path -LiteralPath $symbolPack)) {
            Get-ChildItem -Path symbols -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "Private symbol pack not found: $symbolPack"
          }
          New-Item -ItemType Directory -Path (Join-Path $PWD 'artifacts') -Force | Out-Null
          Copy-Item -LiteralPath $symbolPack -Destination (Join-Path $PWD 'artifacts') -Force

      - name: Verify SignPath signatures
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          INSTALLER_NAME: ${{ needs.package_windows.outputs.installer_name }}
          MSI_NAME: ${{ needs.release_artifacts.outputs.msi_name }}
          REQUIRE_TRUEHDR_RUNTIME: ${{ inputs.require_truehdr_runtime }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signpath_signing_policy_slug }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Production signing must produce a fully trusted (Valid) Authenticode chain. The
          # test-signing policy signs with an untrusted SignPath test certificate, whose chain
          # is not Valid on the runner, so in that mode accept an untrusted but intact
          # signature. A HashMismatch still means bytes changed after signing and must fail.
          # Switching to a real production signing policy automatically re-enables the strict
          # Valid requirement with no further edits.
          $allowUntrustedSignatures = ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'test-signing')

          function Test-Signed([string]$Path) {
            $sig = Get-AuthenticodeSignature -LiteralPath $Path
            if ($null -eq $sig.SignerCertificate) { return $false }
            if ($allowUntrustedSignatures) {
              return ($sig.Status -ne 'NotSigned' -and $sig.Status -ne 'HashMismatch')
            }
            return ($sig.Status -eq 'Valid')
          }

          $failures = New-Object System.Collections.Generic.List[string]

          $installer = Join-Path (Join-Path $PWD 'artifacts') $env:INSTALLER_NAME
          if (-not (Test-Path -LiteralPath $installer)) { throw "Signed installer not found: $installer" }
          if (Test-Signed $installer) {
            $subj = (Get-AuthenticodeSignature -LiteralPath $installer).SignerCertificate.Subject
            Write-Host "[verify] OK   setup EXE signed: $($env:INSTALLER_NAME)  ($subj)"
          } else {
            $failures.Add("setup EXE is UNSIGNED: $($env:INSTALLER_NAME)")
          }

          $signedMsi = Join-Path (Join-Path $PWD 'signed-msi') $env:MSI_NAME
          if (-not (Test-Path -LiteralPath $signedMsi)) { throw "Signed MSI not found: $signedMsi" }
          if (Test-Signed $signedMsi) {
            Write-Host "[verify] OK   MSI container signed: $($env:MSI_NAME)"
          } else {
            $failures.Add("MSI container is UNSIGNED: $($env:MSI_NAME)")
          }

          $extractDir = Join-Path ([System.IO.Path]::GetTempPath()) ("msi-verify-" + [System.Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          $log = Join-Path $extractDir 'admin-extract.log'
          $argLine = '/a "{0}" /qn TARGETDIR="{1}" /l*v "{2}"' -f $signedMsi, $extractDir, $log
          $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList $argLine -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 60 | ForEach-Object { Write-Host $_ } }
            throw "Administrative MSI extraction failed (exit $($proc.ExitCode))."
          }

          $virtualDisplayRoot = Join-Path $extractDir 'Apollo\drivers\sunshine'
          $virtualDisplayCatalog = Join-Path $virtualDisplayRoot 'SunshineVirtualDisplayDriver.cat'
          $virtualDisplayInf = Join-Path $virtualDisplayRoot 'SunshineVirtualDisplayDriver.inf'
          $virtualDisplayDll = Join-Path $virtualDisplayRoot 'SunshineVirtualDisplayDriver.dll'
          $expectedSignPathFoundationSigner = 'CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US'
          if (-not (Test-Path -LiteralPath $virtualDisplayCatalog -PathType Leaf)) {
            $failures.Add('Sunshine virtual display catalog is missing from the signed MSI')
          } elseif (Test-Signed $virtualDisplayCatalog) {
            $catalogSignature = Get-AuthenticodeSignature -LiteralPath $virtualDisplayCatalog
            Write-Host "[verify] OK   virtual display catalog signed: $($catalogSignature.SignerCertificate.Subject) ($($catalogSignature.Status))"
            if (-not $allowUntrustedSignatures -and
                $catalogSignature.SignerCertificate.Subject -ne $expectedSignPathFoundationSigner) {
              $failures.Add("virtual display catalog signer is not SignPath Foundation: $($catalogSignature.SignerCertificate.Subject)")
            }
            if (-not $allowUntrustedSignatures) {
              $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
              foreach ($catalogPayload in @($virtualDisplayInf, $virtualDisplayDll)) {
                & $signtool verify '/v' '/pa' '/c' $virtualDisplayCatalog $catalogPayload
                if ($LASTEXITCODE -ne 0) {
                  $payloadName = Split-Path -Leaf $catalogPayload
                  $failures.Add("virtual display catalog does not validate $payloadName")
                }
              }
            }
          } else {
            $catalogSignature = Get-AuthenticodeSignature -LiteralPath $virtualDisplayCatalog
            $failures.Add("Sunshine virtual display catalog is unsigned or untrusted (status=$($catalogSignature.Status))")
          }

          $firstParty = @(
            'sunshine.exe','uninstall.exe','libwebrtc.dll','zlib1.dll',
            'sunshinesvc.exe','dxgi-info.exe','audio-info.exe',
            'playnite-launcher.exe','sunshine_wgc_capture.exe','sunshine_display_helper.exe',
            'virtualdisplay_probe.exe','VkLayer_sunshine_hdr.dll'
          )
          $optionalFirstParty = @('vibeshine_truehdr.dll')
            $vendorSkip = @(
              'SudoVDA.dll','nefconc.exe','SunshineVirtualDisplayDriver.dll','virtualdisplay_probe.exe',
              'VkLayer_sunshine_hdr.dll','VibeshineVhfGamepad.dll','VibeshineVhfGamepadDeviceSetup.exe',
              'nvngx_truehdr.dll','nvngx_vsr.dll'
            )

          $allPe = @(Get-ChildItem -LiteralPath $extractDir -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' })

          foreach ($name in $firstParty) {
            $hits = @($allPe | Where-Object { $_.Name -ieq $name })
            if ($hits.Count -eq 0) {
              $failures.Add("first-party PE missing from MSI: $name")
              continue
            }
            foreach ($f in $hits) {
              if (Test-Signed $f.FullName) {
                Write-Host "[verify] OK   nested signed: $($f.Name)"
              } else {
                $failures.Add("nested first-party PE is UNSIGNED: $($f.FullName)")
              }
            }
          }

          foreach ($name in $optionalFirstParty) {
            $hits = @($allPe | Where-Object { $_.Name -ieq $name })
            if ($hits.Count -eq 0) {
              if ($env:REQUIRE_TRUEHDR_RUNTIME -eq 'true') {
                $failures.Add("required TrueHDR first-party PE missing from MSI: $name")
              }
              continue
            }
            foreach ($f in $hits) {
              if (Test-Signed $f.FullName) {
                Write-Host "[verify] OK   nested signed: $($f.Name)"
              } else {
                $failures.Add("nested TrueHDR first-party PE is UNSIGNED: $($f.FullName)")
              }
            }
          }

          foreach ($f in $allPe) {
            if ($vendorSkip -contains $f.Name) {
              $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
              Write-Host "[verify] skip vendor/catalog file: $($f.Name) (status=$($sig.Status), signer=$($sig.SignerCertificate.Subject))"
            }
          }

          # The immutable producer release arrives unsigned. This repository's
          # MSI request signs exactly the CAT and setup tool; INF, DLL,
          # manifest, install/cleanup scripts, and release lock stay byte-pinned.
          $vhfPackageDir = Join-Path $extractDir 'Apollo\drivers\vhf-gamepad'
          $vhfManifestPath = Join-Path $vhfPackageDir 'manifest.json'
          if (-not (Test-Path -LiteralPath $vhfManifestPath -PathType Leaf)) {
            $failures.Add('VHF gamepad manifest is missing from the signed MSI')
          } else {
            $vhfRequired = @(
              'cleanup.ps1',
              'driver\VibeshineVhfGamepad.inf',
              'driver\VibeshineVhfGamepad.dll',
              'driver\VibeshineVhfGamepad.cat',
              'install.ps1',
              'manifest.json',
              'release-lock.json',
              'tools\VibeshineVhfGamepadDeviceSetup.exe'
            )
            foreach ($relative in $vhfRequired) {
              $path = Join-Path $vhfPackageDir $relative
              if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
                $failures.Add("VHF gamepad package is incomplete: $relative")
              }
            }
            try {
                $vhfActualLayout = @(Get-ChildItem -LiteralPath $vhfPackageDir -Recurse -File | ForEach-Object {
                  $_.FullName.Substring($vhfPackageDir.Length).TrimStart('\', '/').Replace('\', '/')
                } | Sort-Object)
                $vhfExpectedLayout = @($vhfRequired | ForEach-Object { $_.Replace('\', '/') } | Sort-Object)
                if (($vhfActualLayout -join "`n") -cne ($vhfExpectedLayout -join "`n")) {
                  throw "installed VHF layout is not exact: $($vhfActualLayout -join ', ')"
                }
                $vhfManifest = Get-Content -LiteralPath $vhfManifestPath -Raw | ConvertFrom-Json
                $vhfManifestPayload = @(
                  'driver/VibeshineVhfGamepad.cat',
                  'driver/VibeshineVhfGamepad.dll',
                  'driver/VibeshineVhfGamepad.inf',
                  'tools/VibeshineVhfGamepadDeviceSetup.exe'
                )
                if ($vhfManifest.schema_version -ne 1 -or
                    $vhfManifest.source_revision -cne '52cbb8f27cbeb18baec53ca5d7b88081f0787a06' -or
                    $vhfManifest.driver_ver -cne '08/21/2026,0.1.0.30' -or
                    [uint16] $vhfManifest.protocol_version -ne 2 -or
                    $vhfManifest.platform -cne 'x64' -or
                    $vhfManifest.signing.channel -cne 'msi-request-signing') {
                  throw 'manifest metadata does not match the pinned beta.2 producer release'
                }
                $manifestPaths = @($vhfManifest.files | ForEach-Object { [string] $_.path } | Sort-Object)
                if (($manifestPaths -join "`n") -cne ($vhfManifestPayload -join "`n")) {
                  throw 'manifest payload list is not exact'
                }
                $vhfDownstreamSigned = @(
                  'driver/VibeshineVhfGamepad.cat',
                  'tools/VibeshineVhfGamepadDeviceSetup.exe'
                )
                $vhfUnsignedProducer = @(
                  'driver/VibeshineVhfGamepad.cat',
                  'driver/VibeshineVhfGamepad.dll',
                  'tools/VibeshineVhfGamepadDeviceSetup.exe'
                )
                if ((@($vhfManifest.signing.signed_downstream) -join "`n") -cne ($vhfDownstreamSigned -join "`n") -or
                    (@($vhfManifest.signing.unsigned_payloads) -join "`n") -cne ($vhfUnsignedProducer -join "`n") -or
                    $vhfManifest.signing.catalog_membership.basis -cne 'fresh-inf2cat' -or
                    $vhfManifest.signing.catalog_membership.generator -cne 'Inf2Cat') {
                  throw 'manifest signing ownership or fresh Inf2Cat evidence is invalid'
                }
                foreach ($entry in @($vhfManifest.files)) {
                  if ($null -eq $entry -or [string]::IsNullOrWhiteSpace($entry.path) -or
                      [string]::IsNullOrWhiteSpace($entry.sha256) -or
                      $entry.path -match '(^|/)\.\.(/|$)|^[A-Za-z]:|^[/\\]') {
                    throw 'manifest contains an invalid file entry'
                  }
                  $path = Join-Path $vhfPackageDir ($entry.path -replace '/', '\\')
                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                    throw "manifest file is missing: $($entry.path)"
                  }
                  $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($vhfDownstreamSigned -contains $entry.path) {
                    if ($actual -ceq $entry.sha256.ToLowerInvariant()) {
                      throw "downstream-signed payload was not rewritten by SignPath: $($entry.path)"
                    }
                    continue
                  }
                  if ($actual -ne $entry.sha256.ToLowerInvariant()) {
                    throw "manifest hash mismatch: $($entry.path)"
                  }
                }
                $vhfCatalog = Join-Path $vhfPackageDir 'driver\VibeshineVhfGamepad.cat'
                $vhfDll = Join-Path $vhfPackageDir 'driver\VibeshineVhfGamepad.dll'
                $vhfTool = Join-Path $vhfPackageDir 'tools\VibeshineVhfGamepadDeviceSetup.exe'
                if (-not (Test-Signed $vhfCatalog)) { throw 'VHF catalog is unsigned or untrusted' }
                if (-not (Test-Signed $vhfTool)) { throw 'VHF setup tool is unsigned or untrusted' }
                $vhfDllSignature = Get-AuthenticodeSignature -LiteralPath $vhfDll
                if ($vhfDllSignature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned -or
                    $null -ne $vhfDllSignature.SignerCertificate) {
                  throw 'catalog-bound VHF DLL was unexpectedly Authenticode-signed'
                }
                $vhfCatalogSignature = Get-AuthenticodeSignature -LiteralPath $vhfCatalog
                $vhfToolSignature = Get-AuthenticodeSignature -LiteralPath $vhfTool
                if ($vhfCatalogSignature.SignerCertificate.Thumbprint -cne $vhfToolSignature.SignerCertificate.Thumbprint) {
                  throw 'VHF catalog and setup tool were signed by different identities'
                }
                if (-not $allowUntrustedSignatures) {
                  if ($vhfCatalogSignature.SignerCertificate.Subject -ne $expectedSignPathFoundationSigner -or
                      $vhfToolSignature.SignerCertificate.Subject -ne $expectedSignPathFoundationSigner) {
                    throw "VHF catalog/setup signer is not SignPath Foundation: catalog='$($vhfCatalogSignature.SignerCertificate.Subject)'; setup='$($vhfToolSignature.SignerCertificate.Subject)'"
                  }
                  $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
                  foreach ($payload in @(
                    (Join-Path $vhfPackageDir 'driver\VibeshineVhfGamepad.inf'),
                    (Join-Path $vhfPackageDir 'driver\VibeshineVhfGamepad.dll')
                  )) {
                    & $signTool verify '/v' '/pa' '/c' $vhfCatalog $payload
                    if ($LASTEXITCODE -ne 0) { throw "VHF catalog membership verification failed: $payload" }
                  }
                }
                $vhfReleaseLockPath = Join-Path $vhfPackageDir 'release-lock.json'
                $vhfReleaseLock = Get-Content -LiteralPath $vhfReleaseLockPath -Raw | ConvertFrom-Json
                if ($null -eq $vhfReleaseLock -or $vhfReleaseLock.schema_version -ne 2) {
                  throw 'release lock is missing or unsupported'
                }
                $vhfManifestHash = (Get-FileHash -LiteralPath $vhfManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($vhfReleaseLock.channel -cne 'production' -or
                    $vhfReleaseLock.repository -cne 'Nonary/libvirtualgamepad' -or
                    $vhfReleaseLock.release_tag -cne 'v0.1.0-beta.2' -or
                    $vhfReleaseLock.release_asset_name -cne 'libvirtualgamepad-0.1.0-beta.2-windows-x64.zip' -or
                    $vhfReleaseLock.release_asset_sha256 -cne '354c11239a91fd9fb2f52d45449de8409d96a4e4ed998f2794b5465eaec2434b' -or
                    $vhfReleaseLock.source_revision -cne $vhfManifest.source_revision -or
                    $vhfReleaseLock.driver_ver -cne $vhfManifest.driver_ver -or
                    [uint16] $vhfReleaseLock.protocol_version -ne [uint16] $vhfManifest.protocol_version -or
                    $vhfReleaseLock.manifest_sha256 -cne $vhfManifestHash -or
                    $vhfReleaseLock.signing_channel -cne 'msi-request-signing' -or
                    (@($vhfReleaseLock.signed_downstream) -join "`n") -cne ($vhfDownstreamSigned -join "`n")) {
                  throw 'release lock does not match the pinned producer or signed VHF manifest'
                }
                foreach ($entry in @($vhfManifest.files)) {
                  $lockedHash = $vhfReleaseLock.producer_payload_sha256.PSObject.Properties[[string] $entry.path]
                  if ($null -eq $lockedHash -or [string] $lockedHash.Value -cne [string] $entry.sha256) {
                    throw "release lock payload hash mismatch: $($entry.path)"
                  }
                }
                foreach ($scriptName in @('install.ps1', 'cleanup.ps1')) {
                  $lockedHash = $vhfReleaseLock.installer_script_sha256.PSObject.Properties[$scriptName]
                  $scriptHash = (Get-FileHash -LiteralPath (Join-Path $vhfPackageDir $scriptName) -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($null -eq $lockedHash -or [string] $lockedHash.Value -cne $scriptHash) {
                    throw "release lock installer-script hash mismatch: $scriptName"
                  }
                }
                Write-Host '[verify] OK   pinned producer VHF package and downstream signatures verified'
            } catch {
              $failures.Add("VHF gamepad package verification failed: $($_.Exception.Message)")
            }
          }

          Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue

          if ($failures.Count -gt 0) {
            Write-Host "::error::SignPath nested-signing verification failed ($($failures.Count) issue(s))."
            $failures | ForEach-Object { Write-Host "::error:: - $_" }
            throw "SignPath verification failed. Confirm the consumer-MSI artifact configuration deep-signs nested PEs in the SignPath portal (see docs/signpath/)."
          }

          Write-Host "[verify] All first-party PEs are signed (outer setup EXE, MSI, and nested binaries)."

      - name: Record release artifact provenance
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_BUILD_RUN_ID: ${{ needs.release_artifacts.outputs.source_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $PWD 'artifacts'
          $assetHashes = [ordered]@{}
          Get-ChildItem -LiteralPath $artifactRoot -File | ForEach-Object {
            $assetHashes[$_.Name] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($assetHashes.Count -eq 0) {
            throw 'No finalized release artifacts were found for provenance.'
          }
          $provenance = [ordered]@{
            schema_version = 1
            release_tag = $env:RELEASE_TAG
            release_commit = $env:RELEASE_COMMIT
            source_build_run_id = $env:SOURCE_BUILD_RUN_ID
            assets = $assetHashes
          }
          $manifestPath = Join-Path $artifactRoot 'release-provenance.json'
          $provenance | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Write-Host "Recorded release provenance for $($env:RELEASE_TAG) from CI run $($env:SOURCE_BUILD_RUN_ID)."

      - name: Upload release provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-provenance
          path: artifacts/release-provenance.json
          if-no-files-found: error
          overwrite: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-Windows
          path: artifacts/
          if-no-files-found: error
          overwrite: true

      - name: Publish private symbols release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_symbols
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.symbol_token }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_version }}
          SYMBOL_RELEASE_DRAFT: ${{ inputs.symbol_release_draft }}
          SYMBOL_RELEASE_PREFIX: ${{ inputs.symbol_release_prefix }}
          SYMBOL_RELEASE_TAG: ${{ inputs.symbol_release_tag }}
          SYMBOL_PRODUCT_NAME: ${{ inputs.symbol_product_name }}
          SYMBOLS_REPO: ${{ inputs.symbol_release_repo }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "SYMBOL_TOKEN is required to upload private symbols to $($env:SYMBOLS_REPO)."
          }

          $sourceReleaseTag = $env:RELEASE_TAG
          $releaseVersion = $sourceReleaseTag
          if ($releaseVersion -match '^v(.+)$') {
            $releaseVersion = $Matches[1]
          }

          if ([string]::IsNullOrWhiteSpace($env:SYMBOL_RELEASE_TAG)) {
            if ($releaseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+((-(alpha|beta|rc|stable)([.-][0-9A-Za-z.-]+)?)|-stable)?$') {
              throw "Unsupported release tag '$sourceReleaseTag'. Expected a release tag like v1.15.2-beta.2."
            }

            if ($env:SYMBOL_RELEASE_PREFIX -notmatch '^(shine|polo)$') {
              throw "Unsupported symbol release prefix '$($env:SYMBOL_RELEASE_PREFIX)'. Expected 'shine' or 'polo'."
            }

            $symbolReleaseTag = "$($env:SYMBOL_RELEASE_PREFIX)_$releaseVersion"
            $prerelease = ($releaseVersion -match '-(alpha|beta|rc)([.-][0-9A-Za-z.-]+)?$')
          } else {
            $symbolReleaseTag = $env:SYMBOL_RELEASE_TAG
            $prerelease = $true
          }

          $draft = ($env:SYMBOL_RELEASE_DRAFT -eq 'true')
          $symbolPack = Join-Path (Join-Path $PWD 'symbols') "$($env:SYMBOL_PRODUCT_NAME)Symbols-$releaseVersion-windows-x64.7z"

          if (-not (Test-Path -LiteralPath $symbolPack)) {
            Get-ChildItem -Path symbols -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "Private symbol pack not found: $symbolPack"
          }

          $releaseTitle = "$($env:SYMBOL_PRODUCT_NAME) symbols v$releaseVersion"
          $releaseNotes = "Private Windows debug symbols for $($env:SYMBOL_PRODUCT_NAME) v$releaseVersion (source release $sourceReleaseTag)."

          function ConvertTo-JqStringLiteral([string] $Value) {
            return $Value.Replace('\', '\\').Replace('"', '\"')
          }

          function Find-Release([string] $Repo, [string] $Tag, [string] $Name) {
            $jqTag = ConvertTo-JqStringLiteral $Tag
            $releaseJson = @(& gh api --paginate "repos/$Repo/releases" --jq ".[] | select(.tag_name == `"$jqTag`") | @json")
            if ($LASTEXITCODE -ne 0) { throw "Failed to list releases for '$Repo'." }

            if ($releaseJson.Count -eq 0) {
              $jqName = ConvertTo-JqStringLiteral $Name
              $releaseJson = @(& gh api --paginate "repos/$Repo/releases" --jq ".[] | select(.draft == true and .name == `"$jqName`") | @json")
              if ($LASTEXITCODE -ne 0) { throw "Failed to list draft releases for '$Repo'." }
            }

            if ($releaseJson.Count -eq 0) { return $null }
            return ($releaseJson[0] | ConvertFrom-Json)
          }

          $draftValue = $draft.ToString().ToLowerInvariant()
          $prereleaseValue = $prerelease.ToString().ToLowerInvariant()
          $release = Find-Release -Repo $env:SYMBOLS_REPO -Tag $symbolReleaseTag -Name $releaseTitle

          if ($null -ne $release) {
            $releaseJson = & gh api `
              --method PATCH `
              "repos/$($env:SYMBOLS_REPO)/releases/$($release.id)" `
              -f "tag_name=$symbolReleaseTag" `
              -f 'target_commitish=main' `
              -f "name=$releaseTitle" `
              -f "body=$releaseNotes" `
              -F "draft=$draftValue" `
              -F "prerelease=$prereleaseValue"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update private symbols release '$symbolReleaseTag'." }
          } else {
            $releaseJson = & gh api `
              --method POST `
              "repos/$($env:SYMBOLS_REPO)/releases" `
              -f "tag_name=$symbolReleaseTag" `
              -f 'target_commitish=main' `
              -f "name=$releaseTitle" `
              -f "body=$releaseNotes" `
              -F "draft=$draftValue" `
              -F "prerelease=$prereleaseValue"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create private symbols release '$symbolReleaseTag'." }
          }

          $release = $releaseJson | ConvertFrom-Json
          $releaseId = $release.id
          if ([string]::IsNullOrWhiteSpace($releaseId)) { throw "Failed to resolve private symbols release id for '$symbolReleaseTag'." }

          $uploadUrl = [string] $release.upload_url
          if ([string]::IsNullOrWhiteSpace($uploadUrl)) { throw "Failed to resolve private symbols upload URL for '$symbolReleaseTag'." }
          $uploadUrl = $uploadUrl -replace '\{.*$', ''

          $assetName = Split-Path -Leaf $symbolPack
          $assetsJson = & gh api "repos/$($env:SYMBOLS_REPO)/releases/$releaseId/assets"
          if ($LASTEXITCODE -ne 0) { throw "Failed to list private symbols assets for '$symbolReleaseTag'." }

          $assetIds = @($assetsJson | ConvertFrom-Json | Where-Object { $_.name -eq $assetName } | Select-Object -ExpandProperty id)
          foreach ($assetId in $assetIds) {
            & gh api --method DELETE "repos/$($env:SYMBOLS_REPO)/releases/assets/$assetId" *> $null
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete existing private symbol asset '$assetName'." }
          }

          $encodedAssetName = [System.Uri]::EscapeDataString($assetName)
          & gh api `
            --method POST `
            "${uploadUrl}?name=${encodedAssetName}" `
            -H 'Content-Type: application/octet-stream' `
            --input $symbolPack `
            *> $null
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload private symbol pack '$symbolPack'." }

          Write-Host "Uploaded $assetName to $($env:SYMBOLS_REPO) release $symbolReleaseTag (id $releaseId)."
