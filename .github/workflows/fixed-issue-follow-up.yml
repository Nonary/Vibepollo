---
name: Fixed Issue Follow-Up
permissions: {}

on:
  issues:
    types:
      - labeled
  release:
    types:
      - published
  repository_dispatch:
    types:
      - daily-release-published

jobs:
  queue-follow-up:
    name: Queue Fixed Issue Follow-Up
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'fixed' &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null
    concurrency:
      group: fixed-candidate-label-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Fetch public follow-up handler without expanding token permissions
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: git clone --depth=1 --filter=blob:none "$REPOSITORY_URL" "$RUNNER_TEMP/fixed-issue-follow-up"

      - name: Comment that the issue is a candidate fix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        env:
          FOLLOW_UP_REPOSITORY: ${{ runner.temp }}/fixed-issue-follow-up
        with:
          script: |
            const path = require('node:path');
            const { handleFixedLabel } = require(path.join(
              process.env.FOLLOW_UP_REPOSITORY,
              '.github/scripts/fixed_issue_follow_up.js',
            ));
            const result = await handleFixedLabel({ github, context });
            core.info(JSON.stringify(result));

  follow-up-verified-daily:
    name: Ask for Confirmation of a Verified Daily
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'release' &&
       github.event.action == 'published' &&
       github.event.release.draft == false &&
       github.event.release.prerelease == true &&
       (contains(github.event.release.tag_name, '-daily.d') ||
        contains(github.event.release.tag_name, '-nightly.d')))
    concurrency:
      group: fixed-daily-follow-up-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Fetch public source history without contents token access
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: git clone --filter=blob:none "$REPOSITORY_URL" "$RUNNER_TEMP/fixed-issue-repository"

      - name: Resolve the published daily identity
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        env:
          REPOSITORY_PATH: ${{ runner.temp }}/fixed-issue-repository
        with:
          script: |
            const path = require('node:path');
            const { isPublishedDaily, releaseFromContext } = require(path.join(
              process.env.REPOSITORY_PATH,
              '.github/scripts/fixed_issue_follow_up.js',
            ));
            const release = releaseFromContext(context);
            const dailyTag = /^\d+\.\d+\.\d+-(?:daily\.d\d{8}(?:\.\d+)?|nightly\.d\d{8}\.[0-9a-f]{12})$/;
            const valid = isPublishedDaily(release) && dailyTag.test(release.tag_name || '') &&
              (context.eventName !== 'repository_dispatch' ||
                /^[0-9a-f]{40}$/i.test(release.source_commit || ''));

            core.setOutput('eligible', String(Boolean(valid)));
            if (valid) {
              core.setOutput('tag_name', release.tag_name);
              core.setOutput('source_commit', context.eventName === 'repository_dispatch'
                ? release.source_commit.toLowerCase()
                : '');
            }

      - name: Fetch public source history and resolve the immutable release tag
        id: source
        if: steps.release.outputs.eligible == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          repository_path="$RUNNER_TEMP/fixed-issue-repository"
          git -C "$repository_path" fetch --filter=blob:none --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_commit="$(git -C "$repository_path" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ -n "${EXPECTED_SOURCE_COMMIT}" && "${EXPECTED_SOURCE_COMMIT}" != "${release_commit}" ]]; then
            echo "::notice::The daily dispatch source did not match its immutable tag; no issue follow-up was sent."
            exit 0
          fi
          {
            echo "release_commit=${release_commit}"
            echo "repository_path=${repository_path}"
          } >> "$GITHUB_OUTPUT"

      - name: Request reporter confirmation only for verified candidates
        if: steps.source.outputs.release_commit != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          REPOSITORY_PATH: ${{ steps.source.outputs.repository_path }}
        with:
          script: |
            const path = require('node:path');
            const { handleDailyReleaseFollowUp } = require(path.join(
              process.env.REPOSITORY_PATH,
              '.github/scripts/fixed_issue_follow_up.js',
            ));
            const { releaseFromContext } = require(path.join(
              process.env.REPOSITORY_PATH,
              '.github/scripts/fixed_issue_follow_up.js',
            ));
            const release = releaseFromContext(context);
            const result = await handleDailyReleaseFollowUp({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              release,
              releaseCommit: process.env.RELEASE_COMMIT,
              repositoryPath: process.env.REPOSITORY_PATH,
            });
            core.info(JSON.stringify(result));
