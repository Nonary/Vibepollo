---
name: Daily prerelease
permissions: {}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation (also requires DAILY_RELEASE_ENABLED)
        type: boolean
        default: false

# The default branch owns the cron launcher. This workflow owns qualification
# and publication, whether dispatched by that launcher or manually from Canary.
concurrency:
  group: vibepollo-numeric-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Nonary/Vibepollo' &&
      github.ref_type == 'branch' &&
      github.ref_name == 'canary' &&
      vars.DAILY_RELEASE_SOURCE_BRANCH == 'canary' &&
      vars.DAILY_RELEASE_SOURCE_CONFIRMED == 'Nonary/Vibepollo:canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      stable_anchor_tag: ${{ steps.identity.outputs.stable_anchor_tag }}
      stable_anchor_commit: ${{ steps.identity.outputs.stable_anchor_commit }}
      should_build: ${{ steps.identity.outputs.should_build }}
      skip_reason: ${{ steps.identity.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # The resolver requires the confirmed remote Canary to still name
          # this exact dispatched workflow/source commit.
          fetch-depth: 0
      - name: Test daily release contracts
        run: |
          python -m unittest discover -s scripts/tests -p test_daily_release.py
          python -m unittest discover -s scripts/tests -p test_numeric_release.py
          python -m unittest discover -s scripts/tests -p test_release_guards.py
          python -m unittest discover -s .github/scripts -p test_vhf_release_identity.py
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P scripts/tests/test_build_channel.cmake
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" -P packaging/windows/wix/tests/test_windows_version_numbers.cmake
      - name: Test nightly notes and immutable metadata
        run: python -m unittest discover -s scripts/tests -p test_nightly_notes.py
      - name: Resolve explicitly confirmed remote source and immutable identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_PRIMARY_BRANCH: ${{ github.event.repository.default_branch }}
          DAILY_RELEASE_SOURCE_BRANCH: ${{ vars.DAILY_RELEASE_SOURCE_BRANCH }}
          DAILY_RELEASE_SOURCE_CONFIRMED: ${{ vars.DAILY_RELEASE_SOURCE_CONFIRMED }}
        run: python scripts/daily_release.py resolve
      - name: Reserve exact qualified source identity before builds
        if: steps.identity.outputs.should_build == 'true' && vars.DAILY_RELEASE_ENABLED == 'true' && inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_TAG: ${{ steps.identity.outputs.tag }}
          DAILY_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          message=$'Vibepollo release channel: nightly\nsource: '"${DAILY_COMMIT}"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${DAILY_TAG}" 2>/dev/null || true)"
          if [[ -z "${ref_json}" ]]; then
            tagger_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f "tag=${DAILY_TAG}" -f "message=${message}" -f "object=${DAILY_COMMIT}" -f "type=commit" \
              -f "tagger[name]=github-actions[bot]" -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" \
              -f "tagger[date]=${tagger_date}" --jq .sha)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${DAILY_TAG}" -f "sha=${tag_object}" >/dev/null
            ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${DAILY_TAG}")"
          fi
          test "$(jq -r '.object.type' <<<"${ref_json}")" = tag
          tag_object="$(jq -r '.object.sha' <<<"${ref_json}")"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          test "$(jq -r '.tag' <<<"${tag_json}")" = "${DAILY_TAG}"
          test "$(jq -r '.object.type' <<<"${tag_json}")" = commit
          test "$(jq -r '.object.sha' <<<"${tag_json}")" = "${DAILY_COMMIT}"
          test "$(jq -r '.message' <<<"${tag_json}")" = "${message}"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ needs.prepare.outputs.commit }}
      release_version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}
      release_channel: nightly
      stable_anchor_tag: ${{ needs.prepare.outputs.stable_anchor_tag }}
      stable_anchor_commit: ${{ needs.prepare.outputs.stable_anchor_commit }}
      daily_validation_only: ${{ vars.DAILY_RELEASE_ENABLED != 'true' || inputs.publish != true }}
      daily_unsigned: true
      build_only: false
      build_tests: true
      use_self_hosted: false
      require_signpath_signing: false
      require_truehdr_runtime: true
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      upload_symbols_artifact: true
      release_artifact_retention_days: 7
    # Only scoped runtime and reusable gamepad signing secrets; no SignPath or inherit.
    secrets:
      truehdr_runtime_token: ${{ secrets.TRUEHDR_RUNTIME_TOKEN }}
      daily_gamepad_pfx_base64: ${{ secrets.NIGHTLY_GAMEPAD_PFX_BASE64 }}
      daily_gamepad_pfx_password: ${{ secrets.NIGHTLY_GAMEPAD_PFX_PASSWORD }}

  linux:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-archlinux.yml
    with:
      release_commit: ${{ needs.prepare.outputs.commit }}
      release_version: ${{ needs.prepare.outputs.version }}
      release_channel: nightly
      use_self_hosted: false
      validation_only: true
      build_tests: true
      artifact_retention_days: 7
      cache_namespace: host-linux-v1

  publish:
    needs: [prepare, build, linux]
    if: >-
      needs.build.result == 'success' && needs.linux.result == 'success' && vars.DAILY_RELEASE_ENABLED == 'true' &&
      inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DAILY_COMMIT: ${{ needs.prepare.outputs.commit }}
      DAILY_TAG: ${{ needs.prepare.outputs.tag }}
      DAILY_VERSION: ${{ needs.prepare.outputs.version }}
      STABLE_ANCHOR_TAG: ${{ needs.prepare.outputs.stable_anchor_tag }}
      STABLE_ANCHOR_COMMIT: ${{ needs.prepare.outputs.stable_anchor_commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Download finalized installer from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-Windows
          path: daily-assets
      - name: Download exact-build Windows symbols from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-symbols-Windows
          path: symbol-assets
      - name: Verify exact-build Windows symbols
        run: |
          set -euo pipefail
          symbol_pack="VibepolloSymbols-${DAILY_VERSION}-windows-x64.7z"
          test -s "symbol-assets/$symbol_pack"
      - name: Retain exact-build Windows symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-windows-symbols
          path: symbol-assets/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Verify finalized provenance, identity and complete asset set
        run: python scripts/daily_release.py verify --assets daily-assets --product Vibepollo
      - name: Download qualified Linux package from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-Archlinux
          path: linux-assets
      - name: Verify and include the installable Linux package
        run: python scripts/daily_release.py linux --assets daily-assets --linux-assets linux-assets --product Vibepollo
      - name: Prepare transparent prerelease notes
        run: |
          set -euo pipefail
          git fetch origin --tags
          python scripts/nightly_notes.py --repo "$GITHUB_REPOSITORY" --tag "$DAILY_TAG" --version "$DAILY_VERSION" --source "$DAILY_COMMIT" --assets daily-assets --notes daily-notes.md
      - name: Preserve qualification evidence in CI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-qualification
          path: |
            daily-assets/daily-manifest.json
            daily-assets/release-provenance.json
            daily-assets/nightly-metadata.json
          retention-days: 90
      - name: Stage useful public downloads and legacy compatibility
        run: python scripts/daily_release.py public --assets daily-assets --destination public-assets --product Vibepollo
      - name: Create once, upload all assets, then expose prerelease
        run: |
          set -euo pipefail
          # The reserved tag pins the tested source even if canary advances.
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DAILY_TAG" --jq .object.sha)"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          expected_message=$'Vibepollo release channel: nightly\nsource: '"${DAILY_COMMIT}"
          test "$(jq -r '.tag' <<<"${tag_json}")" = "${DAILY_TAG}"
          test "$(jq -r '.object.type' <<<"${tag_json}")" = commit
          test "$(jq -r '.object.sha' <<<"${tag_json}")" = "${DAILY_COMMIT}"
          test "$(jq -r '.message' <<<"${tag_json}")" = "${expected_message}"
          existing_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DAILY_TAG" 2>/dev/null || true)"
          if [[ -n "${existing_release}" ]]; then
            if [[ "$(jq -r '.tag_name' <<<"${existing_release}")" != "$DAILY_TAG" ||
                  "$(jq -r '.draft' <<<"${existing_release}")" != "true" ||
                  "$(jq -r '.prerelease' <<<"${existing_release}")" != "true" ]]; then
              echo "::error::Nightly release exists with a different identity or is already published."
              exit 1
            fi
            jq -j '.body // ""' <<<"${existing_release}" > existing-nightly-notes.md
            if ! cmp -s daily-notes.md existing-nightly-notes.md; then
              echo "::error::Existing nightly draft notes do not match this exact source/channel candidate."
              exit 1
            fi
            release_id="$(jq -r '.id' <<<"${existing_release}")"
            RELEASE_ID="$release_id" EXPECTED_RELEASE_NOTES=daily-notes.md python scripts/daily_release.py publication-draft
          else
            # Partial reruns still recompute the shared allocator immediately
            # before creating the immutable draft.
            python scripts/daily_release.py publication
            gh release create "$DAILY_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$DAILY_TAG" --notes-file daily-notes.md --draft --prerelease --latest=false
            release_id="$(gh release view "$DAILY_TAG" --repo "$GITHUB_REPOSITORY" --json id --jq .id)"
          fi
          while IFS= read -r asset; do
            asset_name="$(basename "$asset")"
            existing_asset="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq --arg name "$asset_name" '[.[] | select(.name == $name)] | first // {}')"
            if [[ "$(jq -r '.id // empty' <<<"${existing_asset}")" != "" ]]; then
              expected_digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
              if [[ "$(jq -r '.digest // empty' <<<"${existing_asset}")" != "$expected_digest" ]]; then
                echo "::error::Existing nightly asset differs from the exact candidate: ${asset_name}."
                exit 1
              fi
              continue
            fi
            gh release upload "$DAILY_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(find public-assets -maxdepth 1 -type f -print | sort)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '[.[].name] | sort' > uploaded-assets.json
          python -c 'import json; from pathlib import Path; assert json.loads(Path("uploaded-assets.json").read_text()) == sorted(p.name for p in Path("public-assets").iterdir()), "Uploaded release asset set is incomplete"'
          while IFS=$'\t' read -r asset_name asset_digest; do
            local_digest="sha256:$(sha256sum "public-assets/${asset_name}" | cut -d' ' -f1)"
            if [[ "$asset_digest" != "$local_digest" ]]; then
              echo "::error::Nightly uploaded asset checksum mismatch: ${asset_name}."
              exit 1
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | [.name, (.digest // "")] | @tsv')
          RELEASE_ID="$release_id" EXPECTED_RELEASE_NOTES=daily-notes.md python scripts/daily_release.py publication-draft
          gh release edit "$DAILY_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          release_json="$(gh release view "$DAILY_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,publishedAt)"
          jq -e --arg tag "$DAILY_TAG" '.tagName == $tag and .isPrerelease == true and .isDraft == false and (.publishedAt | type == "string" and length > 0)' <<< "$release_json" >/dev/null
          echo "$release_json" | jq -r 'if .isPrerelease and (.isDraft | not) then "Published prerelease" else error("Incorrect release state") end'

          dispatch_payload="$(mktemp)"
          jq -n \
            --arg tag "$DAILY_TAG" \
            --arg source_commit "$DAILY_COMMIT" \
            --arg published_at "$(jq -r '.publishedAt' <<< "$release_json")" \
            '{event_type:"daily-release-published",client_payload:{tag_name:$tag,source_commit:$source_commit,release_channel:"nightly",published_at:$published_at,draft:false,prerelease:true}}' \
            > "$dispatch_payload"
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input "$dispatch_payload" >/dev/null; then
            echo "::warning::Could not queue the verification-only issue follow-up. The issue remains open; inspect the published daily and complete the reporter follow-up manually if needed."
          fi
          rm -f "$dispatch_payload"

  summary:
    needs: [prepare, build, linux, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record disabled, failed or published outcome
        env:
          ENABLED: ${{ vars.DAILY_RELEASE_ENABLED }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DAILY_TAG: ${{ needs.prepare.outputs.tag }}
          DAILY_COMMIT: ${{ needs.prepare.outputs.commit }}
          SKIP_REASON: ${{ needs.prepare.outputs.skip_reason }}
        run: |
          {
            echo '## Daily prerelease outcome'
            echo "Activation: ${ENABLED:-disabled}"
            echo "Source: $DAILY_COMMIT; tag: $DAILY_TAG"
            echo "Skip reason: ${SKIP_REASON:-none}"
            echo "Prepare: $PREPARE_RESULT; Windows: $BUILD_RESULT; Linux: $LINUX_RESULT; publish: $PUBLISH_RESULT"
            echo 'Failed uploads retain a draft for inspection; no existing daily identity is replaced. Review failed jobs before any manual recovery.'
          } >> "$GITHUB_STEP_SUMMARY"
