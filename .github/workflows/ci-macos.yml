---
name: CI-macOS
permissions: {}

on:
  # Build just the macOS DMGs by hand, for example on a fork with no Apple signing secrets.
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to build, for example 2.0.0
        required: false
        default: '2.0.0'
        type: string
  workflow_call:
    inputs:
      publish_release:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
    secrets:
      # email address
      APPLE_ID:
        required: false
      # 10-character Team ID
      APPLE_TEAM_ID:
        required: false
      # app-specific password in APPLE_ID's account that must be named "notarytool"
      # https://support.apple.com/en-us/102654
      APPLE_NOTARYTOOL_PASSWORD:
        required: false
      # Developer ID Application: Full Name (TEAMIDHERE)
      APPLE_CODESIGN_IDENTITY:
        required: false
      # pkcs12 export from Xcode in base64
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64:
        required: false
      # pkcs12 password added by Xcode export
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD:
        required: false

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_VERSION: ${{ inputs.release_version || '2.0.0' }}
  COMMIT: ${{ inputs.release_commit || github.sha }}
  MACOSX_DEPLOYMENT_TARGET: 14.2
  OPENSSL_VERSION: 3.6.5
  OPENSSL_SHA256: a2157c2830efdec3788939b00c9b0638306d3f0bbb76dc4832ee503bb397df98

jobs:
  build_dmg:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    outputs:
      notarytool_submission_id_arm64: ${{ steps.notarize_submit.outputs.submission_id_arm64 }}
      notarytool_submission_id_x86_64: ${{ steps.notarize_submit.outputs.submission_id_x86_64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-14"
            name: "macOS-arm64"
            arch: "arm64"
          - os: "macos-15-intel"
            name: "macOS-x86_64"
            arch: "x86_64"
    steps:
      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466  # v7.0.0
        if: inputs.publish_release == 'true'
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          brew install --force \
            cmake \
            doxygen \
            graphviz \
            pkgconf \
            miniupnpc \
            opus
          # Runner images ship icu4c@78 unlinked, and installing it again only warns about that.
          # Configure finds it through brew --prefix, linked or not.
          brew list --versions icu4c@78 > /dev/null || brew install icu4c@78

      - name: Cache OpenSSL
        id: openssl_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - name: Build OpenSSL
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          # Homebrew publishes no Intel macOS bottles of OpenSSL, and the runner images' copies
          # target the runner's own macOS, which would raise the DMG's minimum above
          # MACOSX_DEPLOYMENT_TARGET. Build a static OpenSSL for the deployment target instead.
          src="${RUNNER_TEMP}/openssl-src"
          mkdir -p "${src}"
          curl -fsSL -o "${src}/openssl.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  ${src}/openssl.tar.gz" | shasum -a 256 -c -
          tar -xzf "${src}/openssl.tar.gz" -C "${src}"
          cd "${src}/openssl-${OPENSSL_VERSION}"
          ./Configure "darwin64-${MATRIX_ARCH}-cc" no-shared no-tests no-docs \
            "-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            --prefix="${RUNNER_TEMP}/openssl"
          make -j "$(sysctl -n hw.ncpu)" build_sw
          make install_sw

      - name: Configure
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          # Without a Developer ID identity, sign ad hoc ("-"): bundling rewrites the libraries,
          # and an unsigned build won't launch on Apple Silicon.
          mkdir -p build
          cmake \
            -B build \
            -S . \
            -DBUILD_WERROR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DICU_ROOT="$(brew --prefix icu4c@78 2>/dev/null)" \
            -DOPENSSL_ROOT_DIR="${RUNNER_TEMP}/openssl" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOpus_ROOT_DIR="$(brew --prefix opus 2>/dev/null)" \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/Nonary/Vibepollo" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/Nonary/Vibepollo/issues" \
            -DAPPLE_CODESIGN_IDENTITY="${APPLE_CODESIGN_IDENTITY:--}"

      - name: Build
        run: |
          echo "::add-matcher::.github/matchers/gcc.json"
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          echo "::remove-matcher owner=gcc::"

      - name: Package DMG
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          MATRIX_NAME: ${{ matrix.name }}
          # Always sign: with the Developer ID identity when releasing, otherwise ad hoc.
          SHOULD_SIGN: 'true'
        run: |
          # build DMG and sign everything (see cmake/packaging/macos.cmake)
          # cpack can rarely fail with "hdiutil: create failed - Resource busy"
          # so let's allow 1 retry
          if ! cpack -G DragNDrop --config build/CPackConfig.cmake; then
            echo "cpack failed, retrying once with verbose..."
            if ! cpack -G DragNDrop --config build/CPackConfig.cmake --verbose; then
              echo "cpack failed again. Aborting."
              exit 1
            fi
          fi

          mkdir -p artifacts
          dmg_path="$(find build/cpack_artifacts -maxdepth 1 -name 'Vibepollo*.dmg' -print -quit)"
          if [[ -z "${dmg_path}" ]]; then
            dmg_path="$(find build/cpack_artifacts -maxdepth 1 -name '*.dmg' -print -quit)"
          fi
          if [[ -z "${dmg_path}" ]]; then
            echo "No DMG produced in build/cpack_artifacts"
            exit 1
          fi
          cp "${dmg_path}" "artifacts/Vibepollo-${MATRIX_NAME}.dmg"

      - name: Smoke test
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          # Check the packaged app, not the build tree: its signature, the oldest macOS it
          # supports, and that it starts and serves its web UI and serverinfo.
          dmg="artifacts/Vibepollo-${MATRIX_NAME}.dmg"
          mnt="$(mktemp -d)"
          # The DMG shows a license agreement; answer it without a pager.
          yes | PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint "${mnt}" "${dmg}" > /dev/null
          app="${mnt}/Vibepollo.app"
          codesign --verify --deep --strict --verbose=2 "${app}"

          min_macos="$(for f in "${app}"/Contents/MacOS/* "${app}"/Contents/Frameworks/*; do
            vtool -show-build "${f}" 2>/dev/null | awk '/minos/ {print $2}'
          done | sort -V | tail -1)"
          echo "${MATRIX_NAME} requires macOS ${min_macos} or later"
          echo "- ${MATRIX_NAME}: requires macOS ${min_macos} or later" >> "${GITHUB_STEP_SUMMARY}"
          # A bundled library built for a newer macOS raises the whole app's minimum.
          if [[ "$(printf '%s\n' "${min_macos}" "${MACOSX_DEPLOYMENT_TARGET}" | sort -V | tail -1)" != "${MACOSX_DEPLOYMENT_TARGET}" ]]; then
            echo "::error::${MATRIX_NAME} requires macOS ${min_macos}, newer than the ${MACOSX_DEPLOYMENT_TARGET} deployment target"
            hdiutil detach "${mnt}" -quiet || true
            exit 1
          fi

          # A scratch HOME keeps the runner's state out of it; -1 skips loading saved state.
          scratch_home="$(mktemp -d)"
          HOME="${scratch_home}" "${app}/Contents/MacOS/Vibepollo" -1 > smoke.log 2>&1 &
          pid=$!
          started=false
          for _ in $(seq 1 60); do
            if curl -skf -o /dev/null https://localhost:47990/ && curl -sf -o /dev/null http://localhost:47989/serverinfo; then
              started=true
              break
            fi
            kill -0 "${pid}" 2>/dev/null || break
            sleep 1
          done
          kill "${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          hdiutil detach "${mnt}" -quiet || true
          if [[ "${started}" != "true" ]]; then
            echo "Vibepollo didn't serve its web UI and serverinfo. Its output:"
            cat smoke.log
            exit 1
          fi
          echo "Vibepollo started and served its web UI and serverinfo."

      - name: Submit for notarization
        id: notarize_submit
        if: inputs.publish_release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          # Notarizing allows the signed .app to run on any Mac with no prompts.
          # If you don't notarize, users must jump through the "Open Anyway" hoop as well as run
          # `xattr -cr /Applications/Vibepollo.app` to remove quarantine.
          if [[ -n "${APPLE_NOTARYTOOL_PASSWORD}" ]]; then
            dmg_path="$(find build/cpack_artifacts -maxdepth 1 -name 'Vibepollo*.dmg' -print -quit)"
            if [[ -z "${dmg_path}" ]]; then
              dmg_path="$(find build/cpack_artifacts -maxdepth 1 -name '*.dmg' -print -quit)"
            fi
            submission_id=$(xcrun notarytool submit "${dmg_path}" \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_NOTARYTOOL_PASSWORD}" \
              --output-format json \
              | jq -r '.id')
            echo "Submission ID: ${submission_id}"
            echo "submission_id_${MATRIX_ARCH}=${submission_id}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set artifact prefix
        id: artifact_prefix
        env:
          INPUTS_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "${INPUTS_PUBLISH_RELEASE}" == "true" ]]; then
            echo "prefix=unsigned" >> "${GITHUB_OUTPUT}"
          else
            echo "prefix=build" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.artifact_prefix.outputs.prefix }}-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  notarize_dmg:
    name: Notarize ${{ matrix.name }}
    needs: build_dmg
    if: inputs.publish_release == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-14"
            name: "macOS-arm64"
            arch: "arm64"
          - os: "macos-15-intel"
            name: "macOS-x86_64"
            arch: "x86_64"
    steps:
      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466  # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

      - name: Download DMG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: unsigned-${{ matrix.name }}
          path: artifacts

      - name: Wait for notarization and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
          MATRIX_NAME: ${{ matrix.name }}
          SUBMISSION_ID: ${{ matrix.arch == 'arm64'
            && needs.build_dmg.outputs.notarytool_submission_id_arm64
            || needs.build_dmg.outputs.notarytool_submission_id_x86_64 }}
        run: |
          if [[ -z "${SUBMISSION_ID}" ]]; then
            echo "No submission ID found; skipping notarization wait."
            exit 0
          fi

          echo "Polling notarization status for submission: ${SUBMISSION_ID}"
          while true; do
            status=$(xcrun notarytool info "${SUBMISSION_ID}" \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_NOTARYTOOL_PASSWORD}" \
              --output-format json \
              | jq -r '.status')
            echo "Current status: ${status}"
            if [[ "${status}" == "Accepted" ]]; then
              echo "Notarization accepted."
              break
            elif [[ "${status}" == "Invalid" || "${status}" == "Rejected" ]]; then
              echo "Notarization failed with status: ${status}"
              # Print the full log for debugging
              xcrun notarytool log "${SUBMISSION_ID}" \
                --apple-id "${APPLE_ID}" \
                --team-id "${APPLE_TEAM_ID}" \
                --password "${APPLE_NOTARYTOOL_PASSWORD}"
              exit 1
            fi
            echo "Status is '${status}', waiting 30 seconds before retrying..."
            sleep 30
          done

          xcrun stapler staple -v "artifacts/Vibepollo-${MATRIX_NAME}.dmg"

      - name: Upload stapled artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
