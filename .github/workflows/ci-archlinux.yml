---
name: CI-Archlinux
permissions: {}

on:
  workflow_call:
    inputs:
      validation_only:
        description: Artifact-only validation without signing or installing host packages/modules
        required: false
        type: boolean
        default: false
      cache_namespace:
        required: false
        type: string
        default: host-linux-v1
      use_self_hosted:
        required: false
        type: boolean
        default: false
      build_tests:
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        required: false
        type: number
        default: 1
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string

jobs:
  build_archlinux:
    name: Archlinux
    env:
      _use_cuda: true
      GCC14_ARCHIVE_VERSION: 14.3.1+r416+g44d5743651c4-2
      CCACHE_DIR: ${{ github.workspace }}/.linux-cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      # Full toolkit installation is fresh job-local scratch, never a shared cache.
      CUDA_CACHE_DIR: ${{ github.workspace }}/.linux-cache/cuda
      VALIDATION_ONLY: ${{ inputs.validation_only }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      BUILD_VERSION: ${{ inputs.release_version }}
      CLONE_URL: ${{ github.event.repository.clone_url }}
      COMMIT: ${{ inputs.release_commit }}
    permissions:
      contents: read
    runs-on: ${{ !inputs.validation_only && inputs.use_self_hosted && github.repository == 'Nonary/Vibepollo' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted", "Linux", "X64", "linux-release"]') || fromJSON('["ubuntu-latest"]') }}
    container:
      image: archlinux/archlinux:base-devel
    steps:

      - name: Update keyring
        shell: bash
        run: |
          # Update keyring to avoid signature errors, and update system
          pacman -Syy --disable-download-timeout --needed --noconfirm \
            archlinux-keyring
          pacman -Syu --disable-download-timeout --noconfirm
          pacman -Scc --noconfirm

      - name: Setup builder user
        shell: bash
        run: |
          # arch prevents running makepkg as root
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Install dependencies
        shell: bash
        run: |
          pacman -Syu --disable-download-timeout --needed --noconfirm \
            base-devel \
            ccache \
            cmake \
            curl \
            dkms \
            git \
            kmod \
            linux-headers \
            namcap \
            openssl \
            python
          pacman -Scc --noconfirm

      - name: Install Pascal-compatible host compiler
        shell: bash
        run: |
          set -euo pipefail
          # GCC 14 is no longer in rolling Arch repos. Verify the archive's
          # detached signatures before installing these versioned packages.
          compiler_stage="$(mktemp -d)"
          gcc14_version="$GCC14_ARCHIVE_VERSION"
          for package in gcc14-libs gcc14; do
            archive="${package}-${gcc14_version}-x86_64.pkg.tar.zst"
            url="https://archive.archlinux.org/packages/g/${package}/${archive}"
            curl --fail --location --retry 3 "$url" -o "${compiler_stage}/${archive}"
            curl --fail --location --retry 3 "${url}.sig" -o "${compiler_stage}/${archive}.sig"
            pacman-key --verify "${compiler_stage}/${archive}.sig" "${compiler_stage}/${archive}"
          done
          pacman -U --needed --noconfirm "${compiler_stage}"/*.pkg.tar.zst
          gcc-14 --version
          g++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
          submodules: false

      - name: Checkout packaging driver sources
        shell: bash
        # Configure-only packaging requires both pinned Linux driver sources.
        # Native container Git does not retain checkout's temporary HOME/config.
        # Trust only this verified checkout for this invocation, never all repos.
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init --depth 1 -- third-party/libvirtualdisplay third-party/libvirtualgamepad
          test -s third-party/libvirtualdisplay/linux/vibeshine-drm/Makefile
          test -s third-party/libvirtualgamepad/linux/vibeshine-ds5/Makefile
          test -s third-party/libvirtualgamepad/linux/vibeshine-ds5/dkms.conf.in

      - name: Detect actual build budget
        shell: bash
        run: |
          python3 tests/unit/test_linux_build_budget.py
          python3 scripts/linux-build-budget.py
          jobs=$(python3 scripts/linux-build-budget.py --jobs)
          echo "MAKEFLAGS=\"-j${jobs}\"" >> /etc/makepkg.conf
          # Ninja links do not carry GNU make's jobserver. Keep each link's
          # LTO pool bounded instead of spawning nproc workers per link.
          echo 'LTOFLAGS="-flto=1"' >> /etc/makepkg.conf

      - name: Verify CUDA release policy
        if: inputs.build_tests
        shell: bash
        run: python3 tests/unit/test_cuda_release_policy.py

      - name: Compile Vibepollo DRM against Arch kernel
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t kernel_build_dirs < <(
            find /usr/lib/modules -mindepth 2 -maxdepth 2 -type d -name build -print | sort
          )
          if (( ${#kernel_build_dirs[@]} != 1 )); then
            echo "::error::Expected exactly one Arch kernel header tree, found ${#kernel_build_dirs[@]}."
            printf '%s\n' "${kernel_build_dirs[@]}" >&2
            exit 1
          fi

          kernel_release="$(basename "$(dirname "${kernel_build_dirs[0]}")")"
          write_drm_version_header() {
            local module_source=$1
            local module_version=$2
            printf '#define VIBESHINE_DRM_VERSION "%s"\n' "${module_version}" \
              >"${module_source}/vibeshine_drm_version.h"
          }

          module_build_dir="${RUNNER_TEMP}/vibeshine-drm-${kernel_release}"
          cp -a third-party/libvirtualdisplay/linux/vibeshine-drm "${module_build_dir}"
          write_drm_version_header "${module_build_dir}" "0.0.0"
          # The exact pinned helper was audited: it only compiles modules and
          # selects LLVM when required by the kernel; no signing or installation.
          MAKEFLAGS="-j${CMAKE_BUILD_PARALLEL_LEVEL}" \
            "${module_build_dir}/build-module" "${kernel_release}" "${module_build_dir}"
          test -s "${module_build_dir}/vibeshine_drm.ko"

          if [[ "$VALIDATION_ONLY" == "true" ]]; then
            echo "::notice::Unsigned DRM kernel compile passed. Signing, DKMS installation and installed-module checks are omitted in artifact-only validation."
            exit 0
          fi

          signing_key="${RUNNER_TEMP}/vibeshine-drm-mok.key"
          signing_certificate="${RUNNER_TEMP}/vibeshine-drm-mok.pub"
          openssl req -new -x509 -nodes -days 1 \
            -subj '/CN=Vibeshine CI module signing key/' \
            -newkey rsa:2048 -keyout "${signing_key}" \
            -addext 'extendedKeyUsage=codeSigning' \
            -outform DER -out "${signing_certificate}" >/dev/null 2>&1
          "${kernel_build_dirs[0]}/scripts/sign-file" sha256 \
            "${signing_key}" "${signing_certificate}" "${module_build_dir}/vibeshine_drm.ko"

          certificate_serial="$(openssl x509 -inform DER -in "${signing_certificate}" -noout -serial)"
          certificate_serial="${certificate_serial#serial=}"
          module_sig_key="$(modinfo -F sig_key "${module_build_dir}/vibeshine_drm.ko")"
          module_sig_key="${module_sig_key//:/}"
          [[ "${module_sig_key^^}" == "${certificate_serial^^}" ]]
          [[ "$(modinfo -F signer "${module_build_dir}/vibeshine_drm.ko")" == \
             'Vibeshine CI module signing key' ]]

          dkms_ci_version=0.0.1
          dkms_source="/usr/src/vibeshine-drm-${dkms_ci_version}"
          cp -a third-party/libvirtualdisplay/linux/vibeshine-drm "${dkms_source}"
          write_drm_version_header "${dkms_source}" "${dkms_ci_version}"
          sed "s/@PROJECT_VERSION_NUMERIC@/${dkms_ci_version}/g" \
            "${dkms_source}/dkms.conf.in" >"${dkms_source}/dkms.conf"
          printf 'try_sign_modules=true\n' >/etc/dkms/framework.conf.d/vibeshine-ci.conf
          dkms add -m vibeshine-drm -v "${dkms_ci_version}"
          MAKEFLAGS="-j${CMAKE_BUILD_PARALLEL_LEVEL}" dkms build \
            -m vibeshine-drm -v "${dkms_ci_version}" -k "${kernel_release}"
          dkms install -m vibeshine-drm -v "${dkms_ci_version}" -k "${kernel_release}"

          mapfile -t dkms_modules < <(
            find "/usr/lib/modules/${kernel_release}" -type f \
              \( -name 'vibeshine_drm.ko' -o -name 'vibeshine_drm.ko.*' \) \
              -print | sort
          )
          if (( ${#dkms_modules[@]} != 1 )); then
            echo "::error::Expected exactly one DKMS-installed Vibeshine DRM module, found ${#dkms_modules[@]}."
            printf '%s\n' "${dkms_modules[@]}" >&2
            exit 1
          fi
          dkms_module="${dkms_modules[0]}"
          dkms_certificate_serial="$(openssl x509 -inform DER \
            -in /var/lib/dkms/mok.pub -noout -serial)"
          dkms_certificate_serial="${dkms_certificate_serial#serial=}"
          dkms_sig_key="$(modinfo -F sig_key "${dkms_module}")"
          dkms_sig_key="${dkms_sig_key//:/}"
          [[ -n "$(modinfo -F signer "${dkms_module}")" ]]
          [[ "${dkms_sig_key^^}" == "${dkms_certificate_serial^^}" ]]
          dkms remove -m vibeshine-drm -v "${dkms_ci_version}" --all

      - name: Fix workspace permissions
        shell: bash
        run: |
          # Give builder user ownership of the workspace
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Configure PKGBUILD
        shell: bash
        run: |
          # Calculate sub_version
          sub_version=""
          # Branch candidates share the upcoming prerelease version but retain
          # a commit suffix until the exact commit receives its release tag.
          if [[ "${BUILD_VERSION}" == *-* ]]; then
            sub_version=".r${COMMIT}"
          fi

          # Configure PKGBUILD file (as root)
          mkdir -p build
          cd build
          cmake \
            -DSUNSHINE_CONFIGURE_ONLY=ON \
            -DSUNSHINE_CONFIGURE_PKGBUILD=ON \
            -DSUNSHINE_SUB_VERSION="${sub_version}" \
            ..

          # Make sure builder can read from build directory
          chmod -R a+rX "${GITHUB_WORKSPACE}/build"

      - name: Prepare PKGBUILD Package
        shell: bash
        run: |
          # Create pkg directory and move files (as root)
          mkdir -p pkg
          mv build/PKGBUILD pkg/
          mv build/vibepollo.install pkg/

          # Change ownership to builder
          chown -R builder:builder pkg

          # Run makepkg as builder user
          cd pkg
          sudo -u builder env _use_cuda="${_use_cuda}" makepkg --printsrcinfo | tee .SRCINFO

          # create a PKGBUILD archive
          cd ..
          tar -czf vibepollo.pkg.tar.gz -C pkg .

      - name: Install exact package build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the complete installed ABI before computing cache keys.
          # Source the generated recipe; install build/runtime dependencies only,
          # never the host package or its optional GPU drivers.
          _use_cuda=true CARCH=x86_64 bash -c '
            set -euo pipefail
            source pkg/PKGBUILD
            # GCC14 is verified and installed from signed Arch archives above;
            # a sync query for its absent rolling-repository name still fails.
            [[ "$(pacman -Q gcc14)" == "gcc14 ${GCC14_ARCHIVE_VERSION}" ]]
            [[ "$(pacman -Q gcc14-libs)" == "gcc14-libs ${GCC14_ARCHIVE_VERSION}" ]]
            mapfile -t missing < <(pacman -T "${depends[@]}" "${makedepends[@]}" || true)
            if (( ${#missing[@]} )); then
              pacman -S --needed --noconfirm "${missing[@]}"
            fi
            # A final complete dependency check remains mandatory. Unexpected
            # deptest/install errors cannot turn into a passing ABI fingerprint.
            pacman -T "${depends[@]}" "${makedepends[@]}"
          '

      - name: Fingerprint installed Arch toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(pacman -Q | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
          echo "abi=${fingerprint}" >> "$GITHUB_OUTPUT"
          mkdir -p "$CCACHE_DIR" "$CUDA_CACHE_DIR"
          chown -R builder:builder .linux-cache
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"

      - name: Restore checksum-verified CUDA installer
        id: cuda-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: pkg/cuda-x86_64.run
          key: ${{ inputs.cache_namespace }}-cuda-installer-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('packaging/linux/Arch/PKGBUILD', 'packaging/linux/patches/**/cuda-12-math_functions.patch', 'scripts/prepare-linux-cuda.sh', 'scripts/seed-linux-package-source.sh', 'scripts/check-linux-partial-cache.sh', 'scripts/build-linux-component-tests.py') }}

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .linux-cache/ccache
          key: ${{ inputs.cache_namespace }}-ccache-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('packaging/linux/Arch/PKGBUILD', '.github/workflows/ci-archlinux.yml', 'scripts/prepare-linux-cuda.sh', 'scripts/seed-linux-package-source.sh', 'scripts/check-linux-partial-cache.sh', 'scripts/build-linux-component-tests.py') }}-${{ inputs.release_commit }}
          restore-keys: |
            ${{ inputs.cache_namespace }}-ccache-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('packaging/linux/Arch/PKGBUILD', '.github/workflows/ci-archlinux.yml', 'scripts/prepare-linux-cuda.sh', 'scripts/seed-linux-package-source.sh', 'scripts/check-linux-partial-cache.sh', 'scripts/build-linux-component-tests.py') }}-

      - name: Build PKGBUILD
        id: build
        shell: bash
        working-directory: pkg
        env:
          _build_tests: ${{ inputs.build_tests && 'ON' || 'OFF' }}
        run: |
          # Add problem matcher
          echo "::add-matcher::.github/matchers/gcc.json"

          # PKGBUILD installs the pinned CUDA toolkit into its build directory.

          # Check PKGBUILD
          sudo -u builder namcap -i PKGBUILD

          # Export PKGBUILD options so they're available to makepkg
          export _use_cuda="${_use_cuda}"

          # Build the package as builder user (pass through environment variables)
          chown -R builder:builder . "$CCACHE_DIR" "$CUDA_CACHE_DIR"
          package_options=(-si)
          validation_tree=""
          compiler_log=""
          if [[ "$VALIDATION_ONLY" == "true" ]]; then
            validation_tree=$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse "$COMMIT^{tree}")
            sudo -u builder bash "$GITHUB_WORKSPACE/scripts/seed-linux-package-source.sh" \
              "$GITHUB_WORKSPACE" "$PWD/vibepollo" "$CLONE_URL" "$COMMIT"
            compiler_log="$PWD/compiler-cache.log"
            package_options=(-s --holdver)
          fi
          sudo -u builder env \
            CCACHE_DIR="$CCACHE_DIR" \
            CCACHE_MAXSIZE="$CCACHE_MAXSIZE" \
            CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK" \
            CCACHE_LOGFILE="$compiler_log" \
            CUDA_CACHE_DIR="$CUDA_CACHE_DIR" \
            _use_cuda="${_use_cuda}" \
            _build_tests="${_build_tests}" \
            _validation_expected_tree="$validation_tree" \
            BUILD_JOBS="$BUILD_JOBS" \
            CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL}" \
            makepkg "${package_options[@]}" --noconfirm

          # Remove debug package
          rm -f vibepollo-debug*.pkg.tar.zst

          # Remove problem matcher
          echo "::remove-matcher owner=gcc::"

      - name: Verify Arch package contract
        shell: bash
        working-directory: pkg
        run: |
          set -euo pipefail

          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'vibepollo-*.pkg.tar.zst' ! -name '*-debug-*' | sort)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one non-debug Arch package, found ${#packages[@]}."
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi

          package="${packages[0]}"
          package_info="$(bsdtar -xOf "${package}" .PKGINFO)"
          package_files="$(bsdtar -tf "${package}")"
          grep -qx 'pkgname = vibepollo' <<< "${package_info}"
          grep -qx 'provides = sunshine' <<< "${package_info}"
          grep -qx 'conflict = sunshine' <<< "${package_info}"
          grep -qx 'depend = dkms' <<< "${package_info}"
          grep -qx 'depend = mokutil>=0.7.2' <<< "${package_info}"
          grep -qx 'depend = wayland-utils' <<< "${package_info}"
          grep -qx 'depend = xorg-xdpyinfo' <<< "${package_info}"
          grep -qx $'\tmakedepends = nodejs' .SRCINFO
          grep -qx $'\tmakedepends = npm' .SRCINFO
          grep -qx $'\tmakedepends = ninja' .SRCINFO
          grep -qx $'\tmakedepends = kwin' .SRCINFO
          grep -qx $'\tmakedepends = qt6-base' .SRCINFO
          grep -qx $'\tmakedepends = vulkan-headers' .SRCINFO
          grep -qx 'usr/bin/vibepollo' <<< "${package_files}"
          if grep -qx 'usr/bin/sunshine' <<< "${package_files}"; then
            echo "::error::The Vibepollo package unexpectedly contains the legacy Sunshine executable."
            exit 1
          fi
          grep -qx 'usr/lib/systemd/system/vibepollo-session-controller.service' <<< "${package_files}"
          grep -qx 'usr/lib/systemd/system/vibepollo-session-exec.socket' <<< "${package_files}"
          grep -qx 'usr/lib/systemd/system/vibepollo-session-exec@.service' <<< "${package_files}"
          grep -qx 'usr/lib/systemd/system/vibepollo.service' <<< "${package_files}"
          grep -qx 'usr/libexec/vibeshine/vibepollo-session-controller' <<< "${package_files}"
          grep -qx 'usr/libexec/vibeshine/vibepollo-session-exec' <<< "${package_files}"
          grep -qx 'usr/libexec/vibeshine/vibepollo-session-broker' <<< "${package_files}"
          grep -qx 'usr/libexec/vibeshine/vibepollo-provider-scan' <<< "${package_files}"
          grep -qx 'usr/libexec/vibeshine/vibepollo-profile-import' <<< "${package_files}"
          grep -qx 'usr/lib/libvibeshine-kwin-gpu.so' <<< "${package_files}"
          grep -qx 'usr/lib/sysusers.d/vibepollo.conf' <<< "${package_files}"

          # Extract the bridge and the two network-facing execution-chain
          # binaries. The package must not grant either executable file
          # capabilities. systemd supplies the host's narrowly bounded runtime
          # capabilities; the session client must remain entirely unprivileged.
          capability_check_root="$(mktemp -d)"
          bsdtar --xattrs -xpf "${package}" -C "${capability_check_root}" \
            usr/bin/vibepollo \
            usr/libexec/vibeshine/vibepollo-session-exec \
            usr/lib/libvibeshine-kwin-gpu.so
          # Matching KWin 6.8 builds must include both native hooks, not just
          # the legacy bridge that silently leaves these outputs on CPU copies.
          if [[ "$(readlink -f /usr/lib/libkwin.so)" == /usr/lib/libkwin.so.6.8.* ]]; then
            readelf --dyn-syms --wide \
              "${capability_check_root}/usr/lib/libvibeshine-kwin-gpu.so" \
              > "${capability_check_root}/kwin-bridge-symbols.txt"
            grep -q ' _ZN4KWin26GbmGraphicsBufferAllocator8allocateERKNS_21GraphicsBufferOptionsE$' \
              "${capability_check_root}/kwin-bridge-symbols.txt"
            grep -q ' _ZNK4KWin10GpuManager26findCompatibleRenderDeviceEP10_drmDevice$' \
              "${capability_check_root}/kwin-bridge-symbols.txt"
          fi
          for capability_path in \
            "${capability_check_root}/usr/bin/vibepollo" \
            "${capability_check_root}/usr/libexec/vibeshine/vibepollo-session-exec"; do
            if [[ -n "$(getcap -n "${capability_path}" 2>/dev/null)" ]]; then
              echo "::error::The package unexpectedly grants file capabilities to ${capability_path#${capability_check_root}/}."
              exit 1
            fi
          done
          for obsolete_path in \
            usr/lib/systemd/system/vibepollo-machine-prepare.service \
            usr/lib/systemd/system/vibepollo-prelogin.service \
            usr/lib/systemd/system/vibepollo-session-restore@.service \
            usr/libexec/vibeshine/vibepollo-prelogin-sync \
            usr/libexec/vibeshine/vibepollo-session-handoff \
            usr/libexec/vibeshine/vibepollo-session-ready; do
            if grep -qx "${obsolete_path}" <<< "${package_files}"; then
              echo "::error::The Vibeshine package unexpectedly contains obsolete login-path file ${obsolete_path}."
              exit 1
            fi
          done
          if grep -Eq '(^|/)pam_vibepollo_session\.so$' <<< "${package_files}"; then
            echo "::error::The Vibeshine package unexpectedly contains the obsolete PAM handoff module."
            exit 1
          fi
          if grep -qx 'usr/lib/systemd/user/app-io.github.Nonary.vibepollo.service' <<< "${package_files}"; then
            echo "::error::The native package unexpectedly contains the legacy per-user host service."
            exit 1
          fi
          grep -qx 'usr/share/applications/io.github.Nonary.vibepollo.desktop' <<< "${package_files}"
          grep -qx 'usr/libexec/vibeshine/vibeshine-drm-install' <<< "${package_files}"
          grep -qx 'usr/src/vibeshine-drm-[^/]*/dkms.conf' <<< "${package_files}"
          bsdtar -xOf "${package}" usr/libexec/vibeshine/vibeshine-drm-install | bash -n
          bsdtar -xOf "${package}" usr/libexec/vibeshine/vibepollo-session-controller | bash -n
          bsdtar -xOf "${package}" usr/libexec/vibeshine/vibepollo-machine-host | bash -n
          package_install_script="$(bsdtar -xOf "${package}" .INSTALL)"
          bash -n <<< "${package_install_script}"
          grep -Fq 'vibeshine-drm-install install-package' <<< "${package_install_script}"

      - name: Copy Artifacts
        shell: bash
        run: |
          # create artifacts directory
          mkdir -p artifacts

          # Copy built packages to artifacts
          cp pkg/vibepollo*.pkg.tar.zst artifacts/
          cp vibepollo.pkg.tar.gz artifacts/
          python3 -c 'import hashlib,json,os,pathlib,subprocess; root=pathlib.Path("artifacts"); packages=list(root.glob("vibepollo-*.pkg.tar.zst")); assert len(packages)==1; sha=subprocess.check_output(["git","-c","safe.directory="+os.environ["GITHUB_WORKSPACE"],"rev-parse","HEAD"],text=True).strip(); assert sha==os.environ["COMMIT"]; data=dict(schema_version=1,source_commit=sha,version=os.environ["BUILD_VERSION"],workflow_run_id=os.environ["GITHUB_RUN_ID"],assets={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in packages}); (root/"linux-provenance.json").write_text(json.dumps(data,indent=2)+"\n")'

          # List artifacts
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-Archlinux
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Report compiler cache
        shell: bash
        run: ccache --show-stats

      - name: Verify failed-validation partial cache eligibility
        id: partial-cache
        if: >-
          failure() && inputs.validation_only && github.event_name == 'workflow_dispatch' &&
          github.event.repository.full_name == github.repository && steps.build.outcome == 'failure' &&
          steps.toolchain.outputs.abi != ''
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          TOOLCHAIN_ABI: ${{ steps.toolchain.outputs.abi }}
          PACKAGE_BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          bash scripts/check-linux-partial-cache.sh pkg/PKGBUILD pkg/cuda-x86_64.run \
            packaging/linux/patches/x86_64/cuda-12-math_functions.patch pkg/compiler-cache.log >> "$GITHUB_OUTPUT"
          ccache --show-stats

      - name: Save checksum-verified CUDA installer
        if: >-
          always() && steps.cuda-cache.outputs.cache-hit != 'true' &&
          ((success() && (github.ref_name == github.event.repository.default_branch ||
            (github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository))) ||
           steps.partial-cache.outputs.cuda == 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: pkg/cuda-x86_64.run
          key: ${{ steps.cuda-cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: >-
          always() &&
          ((success() && (github.ref_name == github.event.repository.default_branch ||
            (github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository))) ||
           steps.partial-cache.outputs.compiler == 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .linux-cache/ccache
          key: ${{ inputs.cache_namespace }}-ccache-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('packaging/linux/Arch/PKGBUILD', '.github/workflows/ci-archlinux.yml', 'scripts/prepare-linux-cuda.sh', 'scripts/seed-linux-package-source.sh', 'scripts/check-linux-partial-cache.sh', 'scripts/build-linux-component-tests.py') }}-${{ inputs.release_commit }}

      - name: Restore self-hosted workspace ownership
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # The container writes as root and builder, but the persistent runner
          # must be able to clean its workspace and temporary files after a job.
          runner_owner="$(stat -c '%u:%g' "${RUNNER_TEMP}/..")"
          chown -R "${runner_owner}" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
