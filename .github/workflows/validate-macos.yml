---
name: Validate macOS
permissions: {}

on:
  workflow_dispatch:
    inputs:
      build_tests:
        description: Compile and execute the full test suite
        type: boolean
        default: true
      release_version:
        description: Package version string
        type: string
        default: 2.0.1-macos-validation

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ inputs.release_version }}
      build_tests: ${{ inputs.build_tests }}
    secrets: inherit
