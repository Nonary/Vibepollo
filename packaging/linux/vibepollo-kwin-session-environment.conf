# KWin creates the Wayland socket and randomized Xauthority path after the
# user manager is already running. Attempt to publish those exact values before
# dependent Plasma targets continue. Keep failure nonfatal to the compositor;
# systemd records the post-start exit status and the helper logs its error.
[Service]
ExecStartPost=-/usr/libexec/vibeshine/vibepollo-kwin-session-environment
