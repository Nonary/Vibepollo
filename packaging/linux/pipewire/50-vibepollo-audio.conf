# Vibepollo streams audio through a virtual PipeWire sink. A 240-sample
# quantum at 48 kHz (5 ms) keeps capture latency below one video frame
# without forcing every application to a tiny buffer.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 240
    default.clock.min-quantum = 240
    default.clock.max-quantum = 2048
}
